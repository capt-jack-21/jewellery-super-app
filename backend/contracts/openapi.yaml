components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: sid, description: 'httpOnly server-side session cookie "<tenant_id>.<opaque token>"; only sha256(token) is stored' }
    adminSession: { type: apiKey, in: cookie, name: admin_sid, description: 'Platform operator session (P23): opaque token backed by platform.platform_admin_session (sha256 only); revoked on logout' }
    partnerSession: { type: apiKey, in: cookie, name: psid, description: 'httpOnly partner session cookie "<partner_id>.<opaque token>" backed by platform.partner_session (sha256 only)' }
  headers:
    ETag: { description: 'Quoted version of the resource, e.g. "3"', schema: { type: string } }
    SessionCookie: { description: 'sid=<tenant_id>.<token>; HttpOnly; Secure; SameSite=Lax; Path=/', schema: { type: string } }
  parameters:
    IfMatch: { name: If-Match, in: header, required: true, description: 'Current version as a quoted ETag, e.g. "3". Missing → 428; stale → 412.', schema: { type: string, pattern: '^(W/)?"[0-9]+"$' } }
    IfMatchList: { name: If-Match, in: header, required: true, description: 'Bulk form (RFC 9110 list): one quoted ETag per item, in items[] order, e.g. `"3", "7"`. Each must equal that item''s items[].version. Missing → 428; wrong count / disagreeing with items[] / stale → 412 version_mismatch (stale items listed in errors[] as items.N.version); nothing changes.', schema: { type: string, pattern: '^(W/)?"[0-9]+"(\s*,\s*(W/)?"[0-9]+")*$' } }
    IfMatchOptional: { name: If-Match, in: header, required: false, description: 'Required when the resource already exists (428 otherwise); stale → 412.', schema: { type: string, pattern: '^(W/)?"[0-9]+"$' } }
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    CompanyId: { name: company_id, in: query, schema: { type: string, format: uuid } }
    Q: { name: q, in: query, schema: { type: string, maxLength: 100 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    MasterLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Ids: { name: ids, in: query, description: 'Batch lookup (1–100 ids): ids=a,b,c (style form, explode false) or repeated ids=a&ids=b; both are accepted. Combine with include_inactive=true to resolve deactivated rows. Unknown or other-shop ids are simply absent.', style: form, explode: false, schema: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/Uuid' } } }
    IncludeInactive: { name: include_inactive, in: query, description: 'true → also return deactivated rows. Default false.', schema: { type: boolean, default: false } }
    SalesBranchQuery: { name: branch_id, in: query, required: true, description: 'Branch of the bill (must be in the caller''s branch scope: 403 branch_scope)', schema: { $ref: '#/components/schemas/Uuid' } }
    SalesBranchQueryOptional: { name: branch_id, in: query, description: 'Filter / scope to one branch (default: every branch in the caller''s scope)', schema: { $ref: '#/components/schemas/Uuid' } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required where declared; absence/empty header →400 idempotency_key_required (N17). Malformed present key →422 idempotency_key_invalid; changed-payload reuse →422 idempotency_key_reused. Retained24h, tenant scoped. Existing optional-create/file semantics unchanged.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
  responses:
    IdempotencyBadRequest: { description: 'N17/IDEM-3 missing/empty required Idempotency-Key →400 idempotency_key_required, before writes/number allocation. Other malformed-request400s retain their normal Problem shape.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    BadRequest: { description: Malformed request, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unauthorized: { description: No valid session, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Forbidden: { description: Missing permission or branch scope, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: Not found (or not in this tenant), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    DuplicateCode: { description: 'A metal (per shop) or purity (per metal) with this code already exists; problem code `duplicate_code`', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: 'Conflicts with current state (e.g. tag not sellable, already cancelled, overlapping period)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unprocessable: { description: 'Validation failed; codes include print_template_not_renderable (0.9.6 print-template create/activate outside the release pins; tag_label exempt), effective_from_in_past, effective_to_in_past, invalid_period, rule_in_use, unknown_company, idempotency_key_invalid, unknown_language, client_supplied_doc_number, client_supplied_doc_date, idempotency_key_reused', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    OverlappingPeriod:
      description: 'Effective periods would overlap (code overlapping_period), or the row was already replaced with a different successor (code already_replaced)'
      content: { application/problem+json: { schema: { allOf: [{ $ref: '#/components/schemas/Problem' }, { type: object, properties: { code: { enum: [overlapping_period, already_replaced] } } }] } } }
    SalesConflict: { description: 'Sales state conflict (problem code): tag_sold, tag_reserved, tag_on_approval, tag_in_transit, tag_in_repair, tag_not_sellable, tag_other_branch, huid_missing, insufficient_loose_stock, todays_rates_missing, onboarding_incomplete, customer_phone_exists (body carries existing_customer {customer_id, name}), estimate_not_open, invoice_cancelled, invoice_fully_paid, invoice_changed, line_already_returned, store_credit_insufficient, receipt_already_reversed, receipt_is_reversal, receipt_not_reversible, idempotency_in_progress', content: { application/problem+json: { schema: { $ref: '#/components/schemas/SalesConflictProblem' } } } }
    SalesUnprocessable: { description: 'Sales validation (problem code, field errors in errors[]): validation_failed (field_not_supported for unknown fields), client_supplied_doc_number, client_supplied_doc_date, idempotency_key_invalid, idempotency_key_reused, duplicate_tag_in_bill, expected_total_mismatch, pan_required, cash_limit_exceeded (mode block; cash on one bill >= cash_limit_amount; not cross-bill person/day/event statutory certification), making_service_rate_not_set (body carries setting_key making_service_rate and settings_path /v1/sales/settings), discount_reason_required, place_of_supply_conflict, old_gold_exceeds_bill, old_gold_payout_required, overpayment, return_window_expired, line_not_on_invoice, reprint_reason_required, print_language_not_supported (supported words providers en/ta; no silent fallback), pinned_print_template_unavailable (0.9.6: also a first-print pin that is not a release pin, unless copy=duplicate + reprint_reason re-pins; body carries unrenderable_template + recovery), print_template_not_renderable (0.9.6: the active template of a first print is not a release pin AND no active platform default exists to fall back to — otherwise the print falls back, see template_fallback_from; nothing logged; body carries unrenderable_template), print_template_not_configured, print_snapshot_unavailable (legacy estimate cannot be safely reconstructed), invoice_print_snapshot_missing (never repair frozen seller from live masters), receipt_print_snapshot_missing (no trustworthy receipt-time balance audit), first_print_duplicate_not_supported (997 forbids duplicate print1 unless the invoice is cancelled; no print is logged), inactive_master, unknown_reference, unknown_language. 403 codes (Forbidden): permission_denied, branch_scope, device_not_approved, discount_not_allowed, below_minimum_needs_override, zero_gst_not_allowed, credit_sale_not_allowed, old_gold_rate_override_not_allowed, reprint_not_allowed.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/SalesUnprocessableProblem' } } } }
    PreconditionFailed: { description: 'Stale If-Match (code version_mismatch); reload and retry', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    PreconditionRequired: { description: 'If-Match header missing (code precondition_required)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    TooManyRequests: { description: 'Rate limited (code rate_limited). The server ALWAYS sends Retry-After (seconds); if it is missing (e.g. stripped by a proxy) clients may fall back to 30 s.', headers: { Retry-After: { description: Seconds until a retry may succeed, schema: { type: integer, minimum: 1 } } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    TooLarge: { description: Payload too large, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    Meta:
      type: object
      required: [api_version, min_client_version, deployment_mode]
      properties:
        api_version: { type: string }
        min_client_version: { type: string }
        deployment_mode: { enum: [shared, dedicated, onprem] }
    Money: { type: string, pattern: '^-?[0-9]{1,12}\.[0-9]{2}$', description: 'Decimal string, 2 dp. Never a JSON number.', examples: ['1234.50'] }
    Weight: { type: string, pattern: '^[0-9]{1,9}\.[0-9]{3}$', description: 'Grams, decimal string, 3 dp.', examples: ['9.500'] }
    Percent: { type: string, pattern: '^[0-9]{1,3}(\.[0-9]{1,3})?$', examples: ['3', '1.5'] }
    Uuid: { type: string, format: uuid }
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: 'Stable machine code, e.g. idempotency_key_reused, client_supplied_doc_number, client_supplied_doc_date, tag_not_sellable' }
        errors: { type: array, items: { type: object, required: [path, message], properties: { path: { type: string }, message: { type: string }, code: { type: string, description: 'Field-level code (0.8.3), e.g. field_not_supported (unknown field), invalid, primary_required' } } } }
        request_id: { type: string }
    SalesUnprocessableProblem:
      description: 'Problem for Sales 422s (0.9.2). code making_service_rate_not_set carries setting_key + settings_path so the UI can open the owner''s settings screen.'
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          properties:
            setting_key: { const: making_service_rate }
            settings_path: { const: /v1/sales/settings }
            unrenderable_template:
              description: '0.9.6 (B-2): on print_template_not_renderable (no platform default to fall back to) / pinned_print_template_unavailable for a non-release pin — the template that cannot be rendered.'
              type: object
              required: [template_id, template_version]
              properties: { template_id: { $ref: '#/components/schemas/Uuid' }, template_version: { type: integer, minimum: 1 } }
            recovery:
              description: '0.9.6 (B-2): on pinned_print_template_unavailable for a non-renderable first-print pin — resend with copy=duplicate and reprint_reason (permission sales.invoice.reprint) to re-pin this reprint to repin_to.'
              type: object
              required: [copy, reprint_reason_required, permission, repin_to]
              properties:
                copy: { const: duplicate }
                reprint_reason_required: { const: true }
                permission: { const: sales.invoice.reprint }
                repin_to: { type: object, required: [template_id, template_version], properties: { template_id: { $ref: '#/components/schemas/Uuid' }, template_version: { type: integer, minimum: 1 } } }
          if: { required: [code], properties: { code: { const: making_service_rate_not_set } } }
          then: { required: [setting_key, settings_path], properties: { setting_key: { type: string }, settings_path: { type: string } } }
    SalesConflictProblem:
      description: 'Problem for Sales 409s (0.9.1). code customer_phone_exists always carries existing_customer so the UI can offer "use this customer".'
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          properties:
            existing_customer:
              type: object
              required: [customer_id, name]
              properties:
                customer_id: { $ref: '#/components/schemas/Uuid' }
                name: { type: string }
          if: { required: [code], properties: { code: { const: customer_phone_exists } } }
          then: { required: [existing_customer], properties: { existing_customer: { type: object } } }
    # ---------- Platform ----------
    Slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$' }
    Gstin: { type: string, pattern: '^[0-9]{2}[A-Z0-9]{13}$', description: Latin characters always }
    StateCode: { type: string, pattern: '^[0-9]{2}$', description: 'GST state code, e.g. "33"' }
    Pan: { type: string, pattern: '^[A-Z]{5}[0-9]{4}[A-Z]$' }
    Phone: { type: string, pattern: '^[0-9]{10,15}$', description: 'Platform users (login phone): 10-15 digits. Masters (customers, vendors, staff, contacts) use MastersPhone.' }
    MastersPhone: { type: string, pattern: '^[6-9][0-9]{9}$', description: 'Response form: the bare 10-digit Indian mobile as stored. Requests use MastersPhoneInput (spaces, dashes, +91/91 accepted).' }
    MastersPhoneInput: { type: string, maxLength: 24, pattern: '^[ -]*(\+?[ -]*9[ -]*1[ -]*)?[6-9]([ -]*[0-9]){9}[ -]*$', description: 'Input form: 10-digit Indian mobile, optionally with spaces, dashes and a +91/91 prefix. The server strips spaces/dashes and a leading +91/91 (only when 10 digits remain), then requires ^[6-9][0-9]{9}$. Responses always return the bare 10 digits (MastersPhone).' }
    Username: { type: string, pattern: '^[a-z0-9._-]{3,40}$' }
    Password: { type: string, format: password, minLength: 8, maxLength: 128 }
    LanguageCode: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$', examples: [en, ta, hi], description: 'A code from platform.language (GET /v1/meta/languages: en, ta, hi, te, kn, ml). Unknown code → 422 unknown_language.' }
    Language:
      type: object
      required: [code, name, native_name]
      properties:
        code: { $ref: '#/components/schemas/LanguageCode' }
        name: { type: string, examples: [Tamil] }
        native_name: { type: string, examples: ['தமிழ்'] }
    NumeralSystem: { enum: [latin, devanagari, tamil, telugu, kannada, malayalam, bengali, gujarati] }
    Hostname: { type: string, maxLength: 253, pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$' }
    Address:
      type: object
      additionalProperties: false
      properties: { line1: { type: string, maxLength: 200 }, line2: { type: string, maxLength: 200 }, city: { type: string, maxLength: 80 }, district: { type: string, maxLength: 80 }, pincode: { type: string, pattern: '^[0-9]{6}$' } }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        tenant: { $ref: '#/components/schemas/Slug', description: 'Shop slug; optional when the Host is a verified custom domain' }
        login: { type: string, minLength: 3, maxLength: 80, description: username or mobile number }
        password: { type: string, format: password, minLength: 1, maxLength: 128 }
        device_key: { type: string, minLength: 32, maxLength: 128, description: Opaque per-device secret generated on first launch }
    OtpStartRequest:
      type: object
      additionalProperties: false
      required: [login]
      properties:
        tenant: { $ref: '#/components/schemas/Slug' }
        login: { type: string, minLength: 3, maxLength: 80 }
        device_key: { type: string, minLength: 32, maxLength: 128 }
    OtpChallenge:
      type: object
      required: [challenge_id, expires_at]
      properties:
        challenge_id: { type: string, description: 'Opaque; "<tenant_id>.<challenge uuid>"' }
        channel: { enum: [sms, whatsapp] }
        masked_destination: { type: string, examples: ['******0001'] }
        expires_at: { type: string, format: date-time }
    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string, maxLength: 120 }
        code: { type: string, pattern: '^[0-9]{6}$' }
        device_key: { type: string, minLength: 32, maxLength: 128 }
    Session:
      type: object
      required: [session_id, tenant_id, user, auth_method, permissions, roles, billing_enabled, idle_timeout_minutes, expires_at]
      properties:
        session_id: { $ref: '#/components/schemas/Uuid' }
        tenant_id: { $ref: '#/components/schemas/Uuid' }
        user: { $ref: '#/components/schemas/User' }
        auth_method: { enum: [password, otp] }
        device_id: { type: [string, 'null'], format: uuid }
        billing_enabled: { type: boolean, description: True only on an approved device (P10) }
        billing_unlocked: { type: boolean, description: Onboarding billing gate (platform.v_billing_unlocked); billing needs both flags }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } }
        permissions: { type: array, items: { type: string } }
        language: { $ref: '#/components/schemas/LanguageCode' }
        idle_timeout_minutes: { type: integer }
        expires_at: { type: string, format: date-time, description: Absolute expiry (12 h) }
    SessionSummary:
      type: object
      required: [id, user_id, auth_method, created_at, last_seen_at, current]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        user_id: { $ref: '#/components/schemas/Uuid' }
        user_name: { type: string }
        device_id: { type: [string, 'null'], format: uuid }
        device_name: { type: [string, 'null'] }
        auth_method: { enum: [password, otp] }
        ip: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean }
    DeviceStatus: { enum: [pending, approved, revoked] }
    DeviceRegistration:
      type: object
