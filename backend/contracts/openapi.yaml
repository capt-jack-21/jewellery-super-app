openapi: 3.1.0
info:
  title: Jewellery Retail SaaS API — Platform + Masters (M1-M8, M10-M15, M17) + Inventory + Sales
  version: 0.9.6
  description: |
    Contract-first. The Platform module (tenants, partners, branches, users and fixed roles, sessions, devices,
    settings, language, onboarding, branding, domains, print templates, audit, import, platform admin) is
    specified in full; the masters/rates/inventory/sales paths below it are the M1 surface and unchanged.

    Conventions: money = decimal strings with 2 dp ("1234.50"), weights = 3 dp; never JSON numbers.
    Auth = opaque httpOnly cookie `sid` backed by `platform.user_session` (sha256 token hash only); no JWT.
    Optimistic concurrency (schema v1.4 `version` columns): versioned resources return `version` in the body and
    `ETag: "<version>"`. Edits (PATCH/PUT/DELETE of mutable fields) MUST send `If-Match: "<version>"`:
    missing → 428 `precondition_required`; stale → 412 `version_mismatch` (the DB updated 0 rows).
    409 stays reserved for uniqueness / state conflicts. Platform / masters state-transition commands (revoke, verify,
    suspend, reactivate) don't take If-Match; their state checks guard them. EXCEPTIONS: print-template activate
    requires If-Match on the template's `row_version`, and every Inventory transition on a versioned row (approve,
    dispatch, receive, cancel, close of transfers / adjustments / stock checks) takes If-Match like an edit (0.8.3).
    Unknown request-body fields are never dropped: 422 `validation_failed` with one `errors[]` entry per field,
    `code: field_not_supported`, path = the field (0.8.3); other field errors carry `code: invalid` or a specific code. Every operation needing If-Match declares
    components/parameters/IfMatch (IfMatchOptional where it's required only once the row exists).
    Every 429 is problem+json `code: rate_limited` with a `Retry-After` header (seconds). Upserts on a resource
    that does not exist yet (first theme, first setting override) need no If-Match.
    Billing is online only. Errors use RFC 9457 problem+json. Every mutating shop endpoint runs in one
    per-request transaction with `app.tenant_id` set (RLS); notifications are written to `notifications.outbox`
    in that transaction and delivered by the worker (the API never talks to pg-boss).
    Not offered (deferred by the feature freeze): custom roles (P6), own SMS sender IDs (P18), general data export (P22; M17
    master-list export IS offered), customer groups (M9), discount schemes (M16), offline billing.
    Master writes need masters.<area>.manage, reads masters.<area>.view (982); KYC reveal needs masters.kyc.reveal (984).
    Masters (0.6.0): every master is list (q, include_inactive, limit, cursor → {items, next_cursor}; metals and purities
    stay unpaged arrays) / create / get / PATCH with If-Match. Masters are never deleted: PATCH {is_active:false} deactivates,
    {is_active:true} reactivates; inactive masters can't be picked on new documents (422 inactive_master). Operations marked
    `x-backing: awaiting 976` are contract-only until data-model migrations 976+ land; until then they are not routed (404).
    Inventory (0.8.3): every /v1/inventory operation is built on migrations 987-989 (inventory settings, tag counter, photos,
    moves, stock-take scans, adjustments, views; 987 also adds tag.vendor_lot_ref) and is tested on the test DB; not deployed yet. Same conventions as masters (lists: q, include_inactive, limit 1-200 default 50, cursor, ids →
    {items, next_cursor}; If-Match on edits; Idempotency-Key on every create; decimal strings; problem+json). Permissions are the 16
    inventory.* codes seeded by 987 (+ inventory.transfer.approve, inventory.tag.view_cost). Salesperson gets inventory.move by default (own branch only; branch transfers excluded). Only Inventory mutates stock (status, location, weights, stock_ledger; every move = location_move + ledger rows): Sales, Purchases,
    approval memos and the import call the Inventory service in their own transaction. See contracts/INVENTORY-CONTRACT-NOTES.md.
    BREAKING (never routed): GET /v1/inventory/tags/{tagNo} moved to GET /v1/inventory/tag-lookup/{tagNo} (operationId unchanged).
    0.8.8 (response shapes only, no behaviour change): every /v1/inventory response is now checked against this contract in the integration
    suite. Fixed in the server to match it: POST /labels and POST /tags/bulk labels return the TagLabelBatch (doc_type, generated_at, template,
    barcode_format; rows with copies and duplicate); GET /statuses returns the bare array; POST /tags/{id}/photos returns the TagPhoto;
    POST /loose-stock/receipts returns the LooseStock balance (was a 500); GET /transfers rows carry lines. Contract corrections to match
    the server: POST /stock-checks/{id}/scans documents 201 (new scan) next to 200 (repeat, duplicate:true); POST /tags (TagCreated) and
    POST /tags/bulk document skipped_numbers; valuation totals document gross_wt and value_basis; report rows document scanned_at.
    Also server-side: stock-check close sends created_adjustment_ids (was adjustment_ids), report rows drop the duplicate tag_status
    (status stays), POST /moves items are LocationMove rows (were ids).
    0.8.9 (response shapes only, no behaviour change): Tag (GET /tags/{id}, /tag-lookup/{tagNo}, GET /tags and every Tag-returning write)
    always sends label_print_count (0 when never printed) and label_printed_at (null when never printed); both are now required. Fields the
    server always sends are now listed in `required` on Tag, TagLabel, TagLabelBatch, StockCheck, StockCheckScanResult, StockCheckScan and
    StockCheckReportRow (nullable ones stay nullable: e.g. report-row scanned_at is null for a missing row, status is null for an unknown code).
    POST /tags/bulk with print_labels returns items read after the print (their label_print_count / label_printed_at / version include it).
    Documented: a tag_label print template's config.barcode_format (code128 | qr; default code128).
    0.9.6 SALES/BRANDING (additive; QA B-2): the release FE renders ONLY the four exact 998 platform pins (bundled-pins.json), never
    by body_key. Release-renderable = exact (template_id, version, doc_type) membership in ReleaseRenderableBodyKey.x-release-print-pins; body_key
    values are documented as ReleaseRenderableBodyKey. Tenant/partner create AND activate of anything outside that set → 422
    print_template_not_renderable before any write — in practice EVERY custom template this release (a new row is a new uuid). PrintTemplate
    gains renderable. Print endpoints (invoice, credit note, estimate, receipt) refuse a first print whose effective template is not a release
    pin with 422 print_template_not_renderable BEFORE any document_print/counter/audit write. A document whose ORIGINAL is already pinned to a
    non-renderable template: copy=auto → 422 pinned_print_template_unavailable carrying recovery; an explicit copy=duplicate + reprint_reason
    (sales.invoice.reprint) re-pins that reprint to the doc type's platform default v1, stamped DUPLICATE, template_repinned=true +
    repinned_from, plus a sales.<doc>.print_template_repinned audit. Renderable pins are never re-pinned; frozen snapshots are unchanged.
    0.9.6 lead decisions (same version, additive): 1(a) resolver fallback — a first print (and GET /v1/sales/settings print_language /
    print_numerals) whose active tenant/partner template is not a release pin SKIPS it and uses the doc type's 998 platform default v1:
    the print succeeds, SalesPrintDocument.template_fallback_from names the skipped template, and a sales.<doc>.print_template_fallback
    audit {doc_no, print_no, from, to} is written with the print. print_template_not_renderable on a print now means only that no active
    platform default exists to fall back to. tag_label no-regression — tag_label templates (Inventory labels: client-drawn, only
    config.barcode_format is read; 998 seeds no tag_label platform template) are EXEMPT from the release-pin check on create, activate and
    resolve, exactly as at 0.9.5; their rows report renderable=true. The pin list moved to ReleaseRenderableBodyKey.x-release-print-pins.
    0.9.4 SALES — frontend rendering is the release design: no server renderer and no rendered-output hash.
    Every successful print has a real pinned template_id/version, language, locale, numerals and a frozen snapshot. Render snapshot,
    not the live document; immutable semantic print audit pins the first public render projection atomically with document_print.
    Reprints retain it even if template activation, master records, receipts, store-credit balance or editable estimates change.
    CreditNote now requires frozen seller, GST/POS, original_invoice and per-line HSN/rate/tax_parts plus tax_summary.
    receipt_reversal is explicitly non-GST: gst_applicable false, empty referenced lines/tax summary, all tax0; original header is context only.
    Live first copy duplicate remains422 first_print_duplicate_not_supported. Per-bill cash and per-part tax rounding stand;
    cross-bill person/day/event cash aggregation is deferred for CA/policy. Missing configured/pinned templates or unrecoverable legacy
    print snapshots fail422; there is never a silent live-master or newly-active-template fallback.
    0.9.3 SALES — data-model 997 (test DB only; not deployed): cancelled invoices always print DUPLICATE stamped CANCELLED, even print 1.
    Print responses/log rows carry required doc_cancelled (immutable print-time snapshot). Zero-piece loose issues/restocks are supported with
    positive net/gross weight. Removed the temporary cancelled-first-print409 and weight-only-loose422 blockers.
    Final0.9.3 also fixes original-liability credit-note rounding, minimum making-charge floors, exact Money2dp/Weight3dp wire scales,
    salesperson eligibility, Tamil backend amount words (unsupported providers fail422 instead of English fallback), first-print template ID/version pinning,
    and explicit present-adjusted receipt balance (adjusted_balance_due_after; balance_due_after is a deprecated alias). copy auto|duplicate is optional.
    Superseded by0.9.4 lead decision: frontend renders; no server renderer/output hash this release. The frontend six-language/native-font matrix is separate UI QA.
    SalesPrintRequest.copy is optional auto|duplicate (default auto); duplicate needs a reason. 997 permits a first duplicate only for cancelled
    invoices; other first duplicate requests return422 first_print_duplicate_not_supported without logging a print (next auto is ORIGINAL1).

    0.9.2 SALES — IMPLEMENTED (routed) on data-model 991-995 (test DB only; not deployed). Reconciled with the schema and Mirage's requests:
    named enums RefundMode / ReturnRefundMode / SalesLineKind / PrintCopy / MakingGstTreatment; POST /v1/sales/preview takes mode invoice|estimate
    (estimate: customer and salesperson optional, invoice-only checks reported, not enforced); Estimate and CreditNote carry print_count +
    last_printed_at; PATCH /v1/sales/settings (owner, sales.settings.edit, If-Match, audited; SalesSettings is now the write path and carries
    version); 422 making_service_rate_not_set carries setting_key + settings_path; store credit (tender credit_note) works at issue and on later
    receipts (guarded draw-down, 409 store_credit_insufficient); NEW POST /v1/sales/invoices/{id}/payments/{receipt_id}/reversal
    (sales.receipt.reverse, owner + manager; reason 5-200; once per receipt → 409 receipt_already_reversed; restores the balance due; store credit
    spent on the receipt comes back as ONE NEW credit note of kind receipt_reversal — the original notes are not topped up); CreditNoteKind adds
    receipt_reversal (no lines, no tax, NOT a GST credit note: excluded from GST returns / the CDN register; owner alert type receipt_reversal,
    "Payment reversed"); PaymentReceipt shows reversal links; SalesSettings.return_settlement_default is ReturnRefundMode (refund → cash / bank_transfer).
    0.9.1 SALES (lead ruling 9 Nov 2026 19:16 IST). Defaults below are per-shop settings (SalesSettings).
    Cash limit (S11, s.269ST): cash received on one bill (at issue + later receipts) >= sales.cash_limit_amount (default 200000.00) →
    mode block (default; 422 cash_limit_exceeded) or warn. Credit sale: a bill with net_payable > 0 and nothing paid (paid_amount 0) needs the
    new permission sales.invoice.credit_sale (default owner, manager; else 403 credit_sale_not_allowed); part-paid needs nothing extra;
    BillRequirements.credit_sale_permission reports it. Old gold rate: server-set by default; OldGoldInput.rate_override + override_reason
    (5-200) needs the new permission sales.old_gold.rate_override (default owner, manager; else 403 old_gold_rate_override_not_allowed), is
    audited (sales.old_gold.rate_override); PricedOldGold adds server_rate, overridden, override_reason (rate_per_g = the applied rate);
    BillRequirements.old_gold_rate_override_permission. 409 customer_phone_exists now carries a typed existing_customer {customer_id, name}
    (SalesConflictProblem). Making GST (CA): default composite with the jewellery (3%); the separate-service making rate is the per-shop
    setting sales.making_service_rate (SalesSettings.making_service_rate) with NO default — while unset, separate mode cannot bill:
    readiness gate making_service_rate and 422 making_service_rate_not_set on preview / issue / estimates. The 0.9.0 "proposed" defaults are
    approved as written (discount warn at 5% / override above 10%, role mapping with zero-GST owner only, merge limit 10, estimates valid
    until end of the IST day, EST number format, store credit as a credit_note tender, whole-line returns, cancelled-bill print rule,
    gst_config.round_off_to wins, reserved tags not sellable).
    0.9.0 SALES (contract only — no Sales route exists yet: every /v1/sales operation is `x-backing: contract only`, 404 until data-model 991+
    land and the module is built). Covers the Sales freeze of 9 Nov 2026 (S1-S23; e-invoice S24, advances S31 and the other Later / Moves items
    are not here). POST /v1/sales/invoices is the ONLY bill writer (INV-2); doc_no / doc_seq / doc_date are server-only (INV-1, D22, D29).
    Bills are immutable (INV-4): later payments are separate receipts; cancel / return issue credit notes from their own gapless series.
    Tag sold / restore and loose / old-gold stock go through the Inventory service in the same transaction (`x-inventory-calls` per operation);
    Sales never writes inventory tables. Money, rates and weights are decimal strings; every timestamp is RFC 3339 `date-time`; always-sent
    fields are `required` (nullable ones stay nullable). Permissions: sales.invoice.issue, sales.invoice.view, sales.invoice.cancel,
    sales.invoice.reprint, sales.invoice.zero_gst, sales.return.issue, sales.payment.receive, sales.estimate.create, sales.discount.give,
    sales.price.override_min. The old M1 stub shapes (IssueInvoiceRequest, Invoice, InvoiceLine, CancelInvoiceRequest, CreditNote) are
    replaced (never routed, so not breaking for any client).
    0.9.0 INVENTORY (behaviour-neutral shapes): every Inventory timestamp is now RFC 3339 in UTC with microseconds
    ("2026-11-09T13:16:01.792494Z"; was Postgres text "2026-11-09 18:46:01.792494+05:30") — label_printed_at, tagged_at, photo created_at,
    settings updated_at, transfer dispatched_at / received_at / cancelled_at (+ line received_at), stock-check started_at / closed_at, scan and
    report scanned_at, adjustment requested_at / decided_at, ledger at, move moved_at. Dates (received_on, since) are unchanged.
    StockSummaryRow (GET /stock-summary rows and totals, every group_by) adds required tag_count (number of tags) next to tag_pieces.
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
servers:
  - url: /api
security:
  - session: []
tags:
  - { name: health, description: Liveness }
  - { name: auth, description: 'P8/P9/P11 login (password, optional OTP), sessions, idle timeout' }
  - { name: devices, description: P10 counter device registration and remote logout }
  - { name: tenant, description: 'Own shop: profile, companies, branches' }
  - { name: users, description: 'P5/P7 users and fixed roles (no custom roles)' }
  - { name: settings, description: 'P11-P13 shop settings, GST, sales policy (old gold, surplus, returns), language' }
  - { name: onboarding, description: P15 ten-step resumable wizard }
  - { name: branding, description: 'P16/P17/P19 theme, custom domain + automatic HTTPS, print templates' }
  - { name: audit, description: INV-3 append-only hash-chained audit log }
  - { name: import, description: P21 CSV/Excel import with dry run }
  - { name: partner, description: 'P2/P3 reseller console: branding and SaaS billing only, never shop data' }
  - { name: admin, description: P23 platform admin console }
  - { name: masters, description: 'Masters frozen 28 Oct: M1 metals, M2 purities, M3 item categories, M4 designs + photos, M5 stones, M6/M7 making-charge and wastage rules, M8 customers, M10 vendors/karigars, M11 staff, M12 floors/counters/trays, M13 HSN, M14 payment modes, M15 bank accounts + card machines. M9 customer groups and M16 discount schemes are deferred.' }
  - { name: rates, description: Metal rates (insert-only) }
  - { name: inventory, description: 'Inventory (0.8.0): tags + auto tag format, labels, bulk tagging, loose stock by weight, branch/counter/tray locations, moves, transfers (in_transit until received), scan stock checks, statuses, adjustments with approval, valuation at today''s rate, opening import (kind stock), optional piece photos and ageing report. Only Inventory changes stock.' }
  - { name: sales, description: 'Sales (0.9.0, contract only; freeze 9 Nov 2026 S1-S23): counter billing (GST tax invoice, the only bill writer), preview, estimates, part-paid bills + later receipts, cancellation and sales-return credit notes, prints. Stock moves only through Inventory.' }
  - { name: orders, description: 'Orders & Repairs (freeze 17 Nov 2026, built slice by slice; contract draft, not deployed): customer and shop orders with lines, edit while open. Vendor assignment, status flow, advances, receipt and delivery are built; repairs: booking, view and edit (O7), vendor issue and receipt with the weight-loss check (O8); billing and lists follow. Only Orders writes orders and repairs.' }
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [status], properties: { status: { const: ok } } } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  # ======================= AUTH (P8, P9, P11) =======================
  # ======================= META (merged from platform-ext draft) =======================
  /v1/meta:
    get:
      tags: [auth]
      operationId: getMeta
      summary: Client compatibility probe (public, no tenant data). api_version = this contract's info.version (generated at build time).
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Meta' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/meta/languages:
    get:
      tags: [auth]
      operationId: listLanguages
      summary: Supported UI / print languages (platform.language; public, global, read-only)
      description: UI/user/default languages use this catalogue. Print setting/override is narrower in0.9.5 — en/ta only; other print API values422 validation_failed. Unknown UI codes422 unknown_language.
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Language' } } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Password login (username or mobile). Sets `sid`, or returns an OTP challenge when OTP is required.
      description: |
        Tenant is resolved from the request Host (verified custom domain) or from `tenant` (shop slug).
        A locked or inactive user, a suspended tenant, or a wrong password all return the same 401.
        If `device_key` belongs to an **approved** device of the tenant the session is bound to it (`billing_enabled: true`);
        otherwise the session cannot issue bills (P10). When `auth.otp_login_enabled` is true and the user has a
        mobile number, a password login is a first factor only: the response is 202 with an OTP challenge.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200':
          description: Logged in
          headers: { Set-Cookie: { $ref: '#/components/headers/SessionCookie' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '202': { description: Second factor required, content: { application/json: { schema: { $ref: '#/components/schemas/OtpChallenge' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/auth/otp/request:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: Start an OTP-only login (P9). Code is sent by SMS/WhatsApp via the outbox.
      description: Always 202 (no user enumeration). Only when `auth.otp_login_enabled` is true. Max 5 attempts per code; 10 minute expiry.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OtpStartRequest' } } } }
      responses:
        '202': { description: Challenge created (if the user exists), content: { application/json: { schema: { $ref: '#/components/schemas/OtpChallenge' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Verify an OTP challenge and open the session
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OtpVerifyRequest' } } } }
      responses:
        '200':
          description: Logged in
          headers: { Set-Cookie: { $ref: '#/components/headers/SessionCookie' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session (reason logout) and clear the cookie
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session, user, effective permissions and idle-timeout deadline
      description: Every authenticated request refreshes `last_seen_at`; a session idle longer than `auth.session_timeout_minutes` is revoked with reason idle_timeout and returns 401 (code session_idle_timeout).
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      summary: Live sessions in the shop (own sessions; all sessions with platform.users.manage)
      parameters: [{ name: user_id, in: query, schema: { $ref: '#/components/schemas/Uuid' } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SessionSummary' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/sessions/{id}:
    delete:
      tags: [auth]
      operationId: revokeSession
      summary: Remote logout of one session (own, or any with platform.users.manage)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/auth/password:
    post:
      tags: [auth]
      operationId: changeOwnPassword
      summary: Change own password (revokes the user's other sessions)
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [current_password, new_password], properties: { current_password: { type: string, format: password }, new_password: { $ref: '#/components/schemas/Password' } } } } } }
      responses:
        '204': { description: Changed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  # ======================= DEVICES (P10) =======================
  /v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: Counter devices of the shop
      parameters: [{ name: status, in: query, schema: { $ref: '#/components/schemas/DeviceStatus' } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Device' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [devices]
      operationId: registerDevice
      summary: Register this device (status pending until a manager approves). Idempotent per device key.
      description: The client generates a random device key on first launch and keeps it locally; only its sha256 is stored.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceRegistration' } } } }
      responses:
        '201': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } } }
        '200': { description: Already registered, content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/devices/current:
    get:
      tags: [devices]
      operationId: getCurrentDevice
      summary: The device bound to the caller's session, or JSON null when this browser/session is not a registered device
      responses:
        '200': { description: 'The device, or null (unregistered browser — not an error)', content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/Device' }, { type: 'null' }] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/devices/{id}/approve:
    post:
      tags: [devices]
      operationId: approveDevice
      summary: Approve a pending device (platform.devices.approve)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/devices/{id}/revoke:
    post:
      tags: [devices]
      operationId: revokeDevice
      summary: Revoke a device — remote logout of every live session on it (platform.devices.approve)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { reason: { type: string, maxLength: 200 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ======================= TENANT / COMPANIES / BRANCHES =======================
  /v1/tenant:
    get:
      tags: [tenant]
      operationId: getTenant
      summary: Own shop (tenant) profile
      responses:
        '200': { description: OK, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [tenant]
      operationId: updateTenant
      summary: Update the shop's default language (the only tenant field a shop may edit; audited as tenant.default_language_changed)
      description: Requires the platform.settings.edit permission (owners have it by default; grantable to no other fixed role today). If-Match carries the tenant `version`. Users with their own `language` keep it. `default_language` must exist in platform.language (FK); an unknown code such as `xx` → 422 `unknown_language`.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TenantPatch' } } } }
      responses:
        '200': { description: OK, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /v1/companies:
    get:
      tags: [tenant]
      operationId: listCompanies
      summary: Legal entities (GSTIN holders)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Company' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tenant]
      operationId: createCompany
      summary: Add a company (platform.settings.edit)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompanyInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Company' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/companies/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [tenant]
      operationId: updateCompany
      summary: Update a company
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompanyPatch' } } } }
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Company' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /v1/companies/{companyId}/bank-accounts:
    parameters: [{ name: companyId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
    get:
      tags: [tenant]
      operationId: listCompanyBankAccounts
      summary: Bank accounts of a company (masters.bank_account). Only account_last4 is ever returned.
      description: 'Picker for card machine settlement_bank_account_id. q matches bank, branch, holder, IFSC or last4; ids (1-100, comma-joined or repeated) for label lookup.'
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { $ref: '#/components/parameters/Ids' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BankAccount' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [tenant]
      operationId: createCompanyBankAccount
      summary: Add a company bank account (account_no in plain text over TLS; stored AES-GCM encrypted, never returned)
      description: Setting `is_default` clears the previous default of this company in the same transaction. Requires platform.settings.edit.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BankAccountCreate' } } } }
      responses:
        '201': { description: Created, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/BankAccount' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/companies/{companyId}/bank-accounts/{id}:
    parameters:
      - { name: companyId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [tenant]
      operationId: getCompanyBankAccount
      summary: One bank account (ETag = version)
      responses:
        '200': { description: OK, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/BankAccount' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [tenant]
      operationId: updateCompanyBankAccount
      summary: Update a bank account (send account_no to replace the number; it is re-encrypted)
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BankAccountPatch' } } } }
      responses:
        '200': { description: OK, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/BankAccount' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [tenant]
      operationId: deleteCompanyBankAccount
      summary: Delete a bank account (prefer PATCH is_active=false once it has been used on documents)
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /v1/branches:
    get:
      tags: [tenant]
      operationId: listBranches
      summary: Branches
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Branch' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tenant]
      operationId: createBranch
      summary: Add a branch (platform.settings.edit); plan limit max_branches applies
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BranchInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Branch' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/branches/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [tenant]
      operationId: updateBranch
      summary: Update or deactivate a branch (branches are never deleted)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BranchPatch' } } } }
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Branch' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  # ======================= USERS & FIXED ROLES (P5, P7; P6 custom roles deferred) =======================
  /v1/roles:
    get:
      tags: [users]
      operationId: listRoles
      summary: The four fixed roles (owner, manager, salesperson, cashier) with their permissions. Read-only — no custom roles.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Role' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/permissions:
    get:
      tags: [users]
      operationId: listPermissions
      summary: Global permission catalogue (read-only)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Permission' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Staff users (platform.users.manage)
      parameters: [{ $ref: '#/components/parameters/Q' }, { name: active, in: query, schema: { type: boolean } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/User' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user with fixed-role assignments (platform.users.manage); plan limit max_users applies
      description: Only an owner may grant the owner role. A user needs a username or a mobile number.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/users/me:
    patch:
      tags: [users]
      operationId: updateMe
      summary: Update own profile — UI language override (P14); null = shop default
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { language: { oneOf: [{ $ref: '#/components/schemas/LanguageCode' }, { type: 'null' }] }, name: { type: string, minLength: 1, maxLength: 120 } } } } } }
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /v1/users/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [users]
      operationId: getUser
      summary: Get a user
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Update a user; is_active=false revokes all their sessions. Users are never deleted.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserPatch' } } } }
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /v1/users/{id}/roles:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [users]
      operationId: setUserRoles
      summary: Replace the user's fixed-role assignments (branch_id null = all branches). The last active owner cannot be removed.
      requestBody: { required: true, content: { application/json: { schema: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/RoleAssignment' } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/users/{id}/password:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [users]
      operationId: resetUserPassword
      summary: Set a user's password (platform.users.manage); revokes their sessions and clears lockout
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [password], properties: { password: { $ref: '#/components/schemas/Password' } } } } } }
      responses:
        '204': { description: Set }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  # ======================= SETTINGS (P11-P14) =======================
  /v1/settings:
    get:
      tags: [settings]
      operationId: listSettings
      summary: Effective settings (platform default → tenant override → branch override) with their source
      parameters: [{ name: branch_id, in: query, schema: { $ref: '#/components/schemas/Uuid' } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Setting' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/settings/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string, pattern: '^[a-z_]+(\.[a-z_]+)+$' }, examples: { timeout: { value: auth.session_timeout_minutes } } }
      - { name: branch_id, in: query, description: Branch-level override, schema: { $ref: '#/components/schemas/Uuid' } }
    put:
      tags: [settings]
      operationId: putSetting
      summary: Override a setting (platform.settings.edit). Value type must match the key's declared type.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [value], properties: { value: { description: 'boolean, integer, number (as string for money keys, e.g. "200000.00") or text', oneOf: [{ type: boolean }, { type: integer }, { type: string }] } } } } } }
      parameters: [{ $ref: '#/components/parameters/IfMatchOptional' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Setting' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [settings]
      operationId: resetSetting
      summary: Remove the override (fall back to the inherited value)
      parameters: [{ $ref: '#/components/parameters/IfMatchOptional' }]
      responses:
        '204': { description: Reset }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /v1/settings/sales-policy:
    get:
      tags: [settings]
      operationId: getSalesPolicy
      summary: 'Effective sales policy: making-charge GST, old-gold valuation and surplus handling, returns (tenant row or platform default)'
      parameters: [{ name: 'on', in: query, schema: { type: string, format: date } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SalesPolicy' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [settings]
      operationId: createSalesPolicy
      summary: Adopt a new tenant policy from effective_from (default today IST, never back-dated); closes the previous tenant row
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SalesPolicyInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SalesPolicy' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/settings/sales-policy/history:
    get:
      tags: [settings]
      operationId: listSalesPolicies
      summary: Platform default and tenant policy rows, newest first
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SalesPolicy' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/settings/language:
    get:
      tags: [settings]
      operationId: getLanguageSettings
      summary: 'P14 language: shop default, the caller''s effective UI language, supported languages and numeral systems'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LanguageSettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  # ======================= ONBOARDING (P15) =======================
  /v1/onboarding:
    get:
      tags: [onboarding]
      operationId: getOnboarding
      summary: Wizard progress (10 steps; resumable). Missing rows read as pending.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Onboarding' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/onboarding/steps/{step}:
    parameters: [{ name: step, in: path, required: true, schema: { $ref: '#/components/schemas/OnboardingStepCode' } }]
    put:
      tags: [onboarding]
      operationId: putOnboardingStep
      summary: Record progress on a step. Only optional steps may be skipped.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [status], properties: { status: { enum: [in_progress, completed, skipped, pending] }, details: { type: object } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Onboarding' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  # ======================= BRANDING (P16, P17, P19) =======================
  /v1/branding/theme:
    get:
      tags: [branding]
      operationId: getTheme
      summary: Effective theme (platform → partner → tenant, merged key-wise) plus the shop's own override
      security: [{ session: [] }, {}]
      description: Unauthenticated callers get the theme for the Host (verified custom domain) so the login page can be branded.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ThemeView' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    put:
      tags: [branding]
      operationId: putTheme
      summary: Replace the shop-level theme override (platform.settings.edit). Asset fields are object-storage keys, never data URIs.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ThemeInput' } } } }
      parameters: [{ $ref: '#/components/parameters/IfMatchOptional' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ThemeView' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /v1/branding/domains:
    get:
      tags: [branding]
      operationId: listDomains
      summary: Custom domains of the shop
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CustomDomain' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [branding]
      operationId: addDomain
      summary: Add a custom domain; returns the DNS TXT record to create
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [hostname], properties: { hostname: { $ref: '#/components/schemas/Hostname' } } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CustomDomain' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/branding/domains/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    delete:
      tags: [branding]
      operationId: removeDomain
      summary: Remove a custom domain
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/branding/domains/{id}/verify:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [branding]
      operationId: verifyDomain
      summary: Check the TXT record `_jewel-verify.<hostname>` = verification_token; on success status verified (TLS then issued on demand)
      responses:
        '200': { description: Result (status verified or failed with failure_reason), content: { application/json: { schema: { $ref: '#/components/schemas/CustomDomain' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/internal/tls/ask:
    get:
      tags: [branding]
      operationId: tlsAsk
      summary: On-demand TLS gate for the edge proxy (P17) — 200 only for verified hostnames
      security: []
      parameters: [{ name: domain, in: query, required: true, schema: { $ref: '#/components/schemas/Hostname' } }]
      responses:
        '200': { description: Certificate may be issued }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/print-templates:
    get:
      tags: [branding]
      operationId: listPrintTemplates
      summary: Own template versions plus resolvable read-only partner/platform defaults
      description: 'Own rows plus only tenant partner/platform rows, including inactive exact versions for reprints. Strict tenant>own-partner>platform, even at identical v1; never version ranking across scopes. Other partners never visible. Edit/activate tenant rows only; defaults read_only=true.'
      parameters: [{ name: doc_type, in: query, schema: { $ref: '#/components/schemas/PrintDocType' } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PrintTemplate' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable', description: 'Invalid doc_type filter → validation_failed.' }
    post:
      tags: [branding]
      operationId: createPrintTemplate
      summary: Create the next version for a doc type (inactive until activated)
      description: '0.9.6 (B-2): custom Sales print templates are NOT renderable this release (the FE renders only the four 998 platform pins), so every create of a Sales doc type (invoice, estimate, receipt, credit_note, order_receipt, rate_card) returns 422 print_template_not_renderable after body validation and before any write. tag_label is exempt (Inventory labels are client-drawn; config.barcode_format code128 | qr): create works exactly as in 0.9.5 (201, inactive until activated).'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PrintTemplateInput' } } } }
      responses:
        '201': { description: 'Created (0.9.6: tag_label only)', content: { application/json: { schema: { $ref: '#/components/schemas/PrintTemplate' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable', description: 'validation_failed (body), then print_template_not_renderable (0.9.6: every doc type except tag_label; nothing created).' }
  /v1/print-templates/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [branding]
      operationId: getPrintTemplate
      summary: Resolve exact visible template metadata, including inactive inherited pins
      description: 'S19 #2: same own-tenant, own-partner and platform chain as the list and Sales resolver. Returns inactive historical versions too. Partner/platform rows are read_only=true. Another tenant or partner returns404, never metadata. Asset rendering remains frontend-owned.'
      responses:
        '200': { description: Exact metadata, content: { application/json: { schema: { $ref: '#/components/schemas/PrintTemplate' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/print-templates/{id}/activate:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [branding]
      operationId: activatePrintTemplate
      summary: Make this version the active one for its doc type (previous active version is deactivated in the same transaction)
      description: 'If-Match carries template `row_version`, NOT document `version`. Non-tenant rows404; unsupported legacy print_language activation422 validation_failed. 0.9.6 (B-2): after 404 / legacy-language 422 / 428 / 412, a row that is not an exact release pin (every tenant row this release, except tag_label, which activates exactly as in 0.9.5) → 422 print_template_not_renderable; the current active template is left unchanged.'
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PrintTemplate' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable', description: 'Legacy template print_language outside en/ta → validation_failed; not a release pin (and not tag_label) → print_template_not_renderable (0.9.6). Activation leaves the prior active template unchanged.' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  # ======================= AUDIT (INV-3) =======================
