  /v1/sales/invoices:
    post:
      tags: [sales]
      operationId: issueInvoice
      summary: Issue a GST tax invoice — the ONLY bill-writing path (INV-2; S1-S14, S17, S18, S21-S23)
      description: |
        One transaction (sales_writer), all or nothing:
        1. gates (S18): approved device on the session (403 device_not_approved), today's rates published for every metal/purity on the bill
           (409 todays_rates_missing), onboarding gst + gst_rates done (409 onboarding_incomplete);
        2. customer: customer_id, or `customer` quick-add by mobile created through the Masters service (409 customer_phone_exists with
           existing_customer {customer_id, name} if that mobile already exists — offer "use this customer"); customer GSTIN → B2B (S22);
        3. lines priced server-side (S4): chargeable_wt = net_wt + wastage; metal = rate × chargeable_wt; + making + stones + hallmark charge;
           discounts (S7); tax per line and per component, each tax head rounded to 0.01 half-up separately (S8, D34); bill round-off per
           gst_config.round_off_to (default ₹1). Client totals are never used; expected_total (= totals.net_payable) mismatch → 422 expected_total_mismatch;
        4. PAN (S10); cash limit (S11): cash on one bill >= cash_limit_amount → 422 cash_limit_exceeded in mode block (default) or a warning in
           warn; 0% GST (S17) only with sales.invoice.zero_gst; credit sale (net_payable > 0, paid_amount 0) only with sales.invoice.credit_sale
           (403 credit_sale_not_allowed; part-paid needs nothing extra); old-gold rate_override only with sales.old_gold.rate_override
           (403 old_gold_rate_override_not_allowed; audited); separate making with sales.making_service_rate unset → 422 making_service_rate_not_set;
        5. number: the next tax_invoice number of this branch's series for the current FY (S12, INV-1), doc_date = server date in Asia/Kolkata;
           doc_no / doc_seq / doc_date / fy / number in the body → 422 client_supplied_doc_number / client_supplied_doc_date;
        6. stock through Inventory in the same transaction (S14): Stock.markSold(tag lines), Stock.sellLoose(loose lines),
           Stock.oldMetalIn(old_metal rows). Sales never writes inventory tables;
        7. estimates[] → billed (S13); payments at issue (S9; part-paid allowed: balance_due > 0 is fine); store-credit redemption reduces the
           credit note's balance_available; audit + InvoiceIssued outbox event.
        Idempotency-Key: same key + same body → 200 with the originally issued invoice; same key + different body → 422 idempotency_key_reused.
        Permissions: sales.invoice.issue; discounts sales.discount.give (+ sales.price.override_min below tag minimum or above the large-discount
        threshold); zero_gst sales.invoice.zero_gst; unpaid (credit) bill sales.invoice.credit_sale; old-gold rate override
        sales.old_gold.rate_override.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IssueInvoiceRequest' } } } }
      responses:
        '201': { description: Issued, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '200': { description: Idempotent replay; the originally issued invoice, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/SalesConflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/SalesUnprocessable' }
      x-backing: implemented on 991-995 (test DB only; not deployed)
      x-inventory-calls: [Stock.validateSellable, Stock.markSold, Stock.sellLoose, Stock.oldMetalIn]
    get:
      tags: [sales]
      operationId: listInvoices
      summary: 'S20 bill list and lookup (number, date, customer, mobile, tag), newest first; read-only'
      description: Branch-scoped roles see their branches only. Requires sales.invoice.view.
      parameters:
        - { $ref: '#/components/parameters/SalesBranchQueryOptional' }
        - { name: q, in: query, description: 'Matches doc_no (prefix, case-insensitive), customer name prefix, customer mobile (10 digits) or a tag number / HUID on a line', schema: { type: string, minLength: 1, maxLength: 64 } }
        - { name: doc_no, in: query, description: Exact bill number, schema: { type: string, maxLength: 16 } }
        - { name: from, in: query, description: 'doc_date ≥ (IST date)', schema: { type: string, format: date } }
        - { name: to, in: query, description: 'doc_date ≤ (IST date)', schema: { type: string, format: date } }
        - { name: customer_id, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
