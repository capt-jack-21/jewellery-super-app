      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [total, legacy_only, encrypted_only, matched, mismatched, ready_to_drop_legacy]
                properties:
                  total: { type: integer }
                  legacy_only: { type: integer }
                  encrypted_only: { type: integer }
                  matched: { type: integer }
                  mismatched: { type: integer }
                  ready_to_drop_legacy: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
