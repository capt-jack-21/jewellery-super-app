      description: |
        The counter renders the returned SalesPrintDocument with the tenant's versioned template in the browser (arch §3.3); the server does not
        return a PDF in this build (PDF archive / e-bill = S25 later). With copy=auto (the default), the first print of a live invoice is the ORIGINAL; every later print is
        copy = duplicate, stamped DUPLICATE, needs sales.invoice.reprint and reprint_reason (3-200 chars; 422 reprint_reason_required), and is
        audited (print_no, language, numerals, template version — never PAN). A cancelled bill prints only as a duplicate stamped CANCELLED with
        the credit note number, including print 1, and always needs reprint permission and reason. copy=duplicate requests a duplicate explicitly;
        it always needs a reason. Under997 a never-printed live invoice cannot start with a duplicate:422 first_print_duplicate_not_supported,
        no print row/counter advance; its next auto request is ORIGINAL print 1. After any successful duplicate, an ORIGINAL can never follow.
