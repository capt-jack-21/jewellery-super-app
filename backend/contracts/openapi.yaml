        next_cursor:
          type: [string, 'null']
    StockValuationRow:
      type: object
      required: [pieces, gross_wt, net_wt, metal_value, total_value, value_basis]
      properties:
        branch_id:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
        counter_id:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
        item_id:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
        metal_id:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
        purity_id:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
        rate_per_g:
          oneOf:
          - {$ref: '#/components/schemas/Money'}
          - {type: 'null'}
        rate_scope:
          oneOf:
          - enum: [branch, shop]
          - {type: 'null'}
        rate_kind:
          oneOf:
          - enum: [sale, old_metal]
          - {type: 'null'}
        pieces: {type: integer, minimum: 0}
        gross_wt: {$ref: '#/components/schemas/Weight'}
        net_wt: {$ref: '#/components/schemas/Weight'}
        metal_value:
          oneOf:
          - {$ref: '#/components/schemas/Money'}
          - {type: 'null'}
        total_value:
          oneOf:
          - {$ref: '#/components/schemas/Money', description: = metal_value in this build (no stone / making)}
          - {type: 'null'}
        value_basis: {$ref: '#/components/schemas/StockValueBasis'}
        labels: {$ref: '#/components/schemas/RefLabels'}
    StockValuation:
      type: object
      required: [as_of, rate_date, group_by, value_basis, rows, totals, missing_rate_purity_ids]
      properties:
        as_of: {type: string, format: date-time}
        value_basis: {$ref: '#/components/schemas/StockValueBasis'}
        rate_date: {type: string, format: date, description: Today in IST}
        group_by:
          enum: [purity, metal, branch, counter, item]
        includes: {$ref: '#/components/schemas/StockValuationIncludes'}
        rows:
          type: array
          items: {$ref: '#/components/schemas/StockValuationRow'}
        totals:
          type: object
          properties:
            pieces: {type: integer, minimum: 0}
            gross_wt: {$ref: '#/components/schemas/Weight'}
            net_wt: {$ref: '#/components/schemas/Weight'}
            value_basis: {$ref: '#/components/schemas/StockValueBasis'}
            metal_value: {$ref: '#/components/schemas/Money'}
            total_value: {$ref: '#/components/schemas/Money'}
            unvalued_net_wt: {$ref: '#/components/schemas/Weight'}
        missing_rate_purity_ids:
          type: array
          items: {$ref: '#/components/schemas/Uuid'}
    StockValueBasis:
      type: string
      description: 'What total_value includes (v_stock_valuation.value_basis, 989). ''metal'' in this build (total_value = metal_value). Later builds may return e.g. ''metal+stone+making''; treat unknown values as opaque labels.'
      examples: [metal]
    StockAgeBasis:
      enum: [received, tagged]
      description: 'Which date the age counts from (989 v_tag_ageing.age_basis): received = tag.received_on (e.g. opening stock); tagged = IST date of tagged_at (tag creation). since = COALESCE(received_on, tagged date).'
    StockValuationIncludes:
      type: object
      description: 'Which value components the totals contain. In 0.8.x metal is always true and stone_value / making / gst are always false (stone value comes later); clients should still read the flags rather than assume.'
      required: [metal, loose, stone_value, making, gst]
      additionalProperties: false
      properties:
        metal: {type: boolean, description: Net weight × today's rate (value_basis metal)}
        loose: {type: boolean, description: "Loose (non-tag) balances included (query include_loose, default true)."}
        stone_value: {type: boolean}
        making: {type: boolean}
        gst: {type: boolean}
    StockCheckExtraReason:
      type: string
      enum: [unknown_code, other_branch, other_location, wrong_status]
      description: 'Stable codes for an extra scan: unknown_code (no piece has this tag_no / EPC / HUID), other_branch (piece belongs to another branch), other_location (same branch, other counter / tray than the check scope), wrong_status (piece is not in stock here; extra_note has its status code, e.g. sold). English labels are client-side.'
    StockAgeingBucket:
      type: object
      required: [code, label, from_days, to_days, pieces, gross_wt, net_wt]
      properties:
        code: {type: string, description: 'Stable code: "<from>_<to>" or "<from>_plus", e.g. 0_29, 365_plus'}
        label: {type: string, description: 'English label: the first bucket is "0–(N−1) days" (e.g. "0–29 days"), the last "N+ days"'}
        from_days: {type: integer, minimum: 0}
        to_days:
          type: [integer, 'null']
          description: Inclusive; null = open-ended
        pieces: {type: integer, minimum: 0}
        gross_wt: {$ref: '#/components/schemas/Weight'}
        net_wt: {$ref: '#/components/schemas/Weight'}
    StockAgeingRow:
      type: object
      required: [tag_id, tag_no, age_days, since, age_basis]
      properties:
        tag_id: {$ref: '#/components/schemas/Uuid'}
        tag_no: {type: string}
        age_days: {type: integer, minimum: 0}
        since: {type: string, format: date}
        age_basis: {$ref: '#/components/schemas/StockAgeBasis'}
        item_id: {$ref: '#/components/schemas/Uuid'}
        purity_id: {$ref: '#/components/schemas/Uuid'}
        counter_id:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
        gross_wt: {$ref: '#/components/schemas/Weight'}
        net_wt: {$ref: '#/components/schemas/Weight'}
    StockAgeingReport:
      type: object
      description: Tagged pieces only (loose stock has no age).
      required: [as_of, basis, bucket_days, groups, totals]
      properties:
        as_of: {type: string, format: date, description: Today in IST}
        basis:
          const: received_or_tagged
          description: 'since = COALESCE(tag.received_on, IST tagged date); each row says which via age_basis'
        group_by: {type: string}
        bucket_days:
          type: array
          items: {type: integer}
        groups:
          type: array
          items:
            type: object
            required: [label, buckets]
            properties:
              key_id:
                oneOf:
                - {$ref: '#/components/schemas/Uuid'}
                - {type: 'null'}
              label: {type: string}
              buckets:
                type: array
                description: Same buckets as totals (same codes, labels and order); empty buckets have zeros (0.8.3)
                items: {$ref: '#/components/schemas/StockAgeingBucket'}
              oldest_days: {type: integer, minimum: 0}
        totals:
          type: array
          items: {$ref: '#/components/schemas/StockAgeingBucket'}
        rows:
          type: array
          items: {$ref: '#/components/schemas/StockAgeingRow'}
        next_cursor:
          type: [string, 'null']
    # ---------- Sales (0.9.0, contract only; S1-S23 of the 9 Nov 2026 freeze) ----------
    FinancialYear: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$', description: 'Indian FY April–March, e.g. "2026-27" (platform.fy_of(doc_date))', examples: ['2026-27'] }
    Rate: { type: string, pattern: '^[0-9]{1,10}\.[0-9]{2}$', description: 'Rupees per gram, decimal string, 2 dp', examples: ['7250.00'] }
    TaxRate: { type: string, pattern: '^[0-9]{1,3}\.[0-9]{2}$', description: 'Percent, decimal string, 2 dp (numeric(5,2))', examples: ['3.00', '1.50', '0.00'] }
    InvoiceStatus: { enum: [issued, cancelled] }
    PaymentStatus: { enum: [paid, part_paid, unpaid], description: 'Derived, never stored: paid = balance_due 0; part_paid = something paid and balance_due > 0; unpaid = nothing paid. A cancelled bill keeps the status it had.' }
    SupplyType: { enum: [b2b, b2c], description: 'b2b when the customer snapshot has a GSTIN (S22), else b2c' }
    GstType: { enum: [intra, inter], description: 'intra = seller state = place of supply → CGST + SGST; inter → IGST (S2)' }
    EstimateStatus: { enum: [draft, billed, cancelled, expired] }
    CreditNoteKind: { enum: [cancellation, sales_return, receipt_reversal], description: 'receipt_reversal (0.9.2): store credit given back when a receipt paid with store credit is reversed — no lines, no tax; not a GST credit note (excluded from GST returns and the CDN register)' }
    RefundMode: { enum: [store_credit, cash, bank_transfer, reversal], description: 'How a credit note''s money goes back: store credit (balance_available), cash, bank transfer, or reversal of each tender (card / UPI refunds outside the app)' }
    ReturnRefundMode: { enum: [store_credit, cash, bank_transfer], description: 'RefundMode without reversal (sales returns and the shop default)' }
    SalesLineKind: { enum: [tag, loose] }
    InvoiceLineKind: { enum: [tag, loose, service], description: 'service = a repair charge billed on delivery (O9): no item, purity, metal rate or making (those fields are null), tax part component service' }
    PrintCopy: { enum: [original, duplicate] }
    MakingGstTreatment: { enum: [composite, separate], description: 'Making charges taxed with the jewellery (composite, HSN 7113) or as a separate service (SAC + making_service_rate)' }
    OldGoldValuationBasis: { enum: [stated_purity, fine_24k] }
    OldGoldExcessHandling: { enum: [refund_on_bill, separate_purchase] }
    CreditNoteRounding: { enum: [follow_invoice, exact], description: 'follow_invoice allocates the original rounded invoice liability to original lines by largest fractional paisa remainder. exact uses unrounded selected line totals capped by remaining liability. In both policies the final return/cancellation credits the exact remaining original invoice liability, with the adjustment in round_off; never fictitious due.' }
    CashLimitMode: { enum: [warn, block] }
    OldGoldPayoutMode: { enum: [cash, bank_transfer] }
    SaleTaxComponent: { enum: [metal, making, stone, hallmark, service], description: 'Per-component/per-line tax part, each tax head independently half-up to paisa before summing (not combined-line-head rounding). making is composite (taxed with metal, same HSN 7113 and rate) or a separate service (SAC + its own rule) per SalesSettings.making_gst_treatment (S5).' }
    SalesPaperFormat: { enum: [A4, A5, thermal_80mm], description: Same values as PrintTemplateInput.paper }
    SalesTenderMode: { enum: [cash, upi, debit_card, credit_card, bank_transfer, cheque, credit_note], description: 'S9 tenders in this build (= masters.payment_mode.kind). credit_note = redeem store credit from a credit note (credit_note_id). advance, chit, gift_voucher and old_gold are not tenders here (advances → Accounts S31; chit S26; old gold is old_metal on the bill).' }
    SalesPaymentMode: { enum: [cash, upi, debit_card, credit_card, bank_transfer, cheque, credit_note, advance], description: 'Mode of a recorded payment. advance = a money advance taken for an order, applied by POST /v1/orders/{id}/deliver; it is never accepted as a tender on a request.' }
    SalesWarning:
      type: object
      required: [code, message, path]
      properties:
        code: { enum: [cash_limit_exceeded, pan_required, below_minimum_price, large_discount, tag_above_max_price, zero_gst, balance_due, old_gold_excess], description: 'Non-blocking notice. On /preview the blocking requirements are reported here too.' }
        message: { type: string }
        path: { type: [string, 'null'], description: 'Request path the warning is about, e.g. lines[2].discount' }
    SalesSettings:
      type: object
      description: 'Effective values today. Written only through PATCH /v1/sales/settings (0.9.2; sales.shop_setting); round_off_to from gst_config, print language / numerals from the strict tenant → own-partner → platform active template (read-only here).'
      required: [version, old_gold_enabled, estimate_no_format, receipt_no_format, making_gst_treatment, making_tax_rule_code, making_service_rate, old_gold_valuation_basis, old_gold_excess_handling, return_window_days, return_settlement_default, credit_note_rounding, round_off_to, pan_required_above, cash_limit_amount, cash_limit_mode, discount_max_pct, large_discount_pct, default_paper, print_language, print_numerals, zero_gst_print_note, estimate_validity_days]
      properties:
        making_gst_treatment: { $ref: '#/components/schemas/MakingGstTreatment', description: 'per shop; default composite (making taxed with the jewellery: HSN 7113, 3%)' }
        making_tax_rule_code: { type: [string, 'null'], description: 'SalesPolicy; the SAC tax rule snapshotted for making when separate' }
        making_service_rate: { oneOf: [{ $ref: '#/components/schemas/TaxRate' }, { type: 'null' }], description: 'setting sales.making_service_rate (0.9.1), per shop, NO default: GST rate on making billed as a separate service. null = not set → while making_gst_treatment is separate, billing is blocked (readiness gate making_service_rate; 422 making_service_rate_not_set on preview / issue / estimates). Ignored when composite.' }
        old_gold_valuation_basis: { $ref: '#/components/schemas/OldGoldValuationBasis', description: SalesPolicy (S6) }
        old_gold_excess_handling: { $ref: '#/components/schemas/OldGoldExcessHandling', description: 'SalesPolicy (S6): when old gold is worth more than the bill' }
        return_window_days: { type: integer, minimum: 0, maximum: 365, description: SalesPolicy (S16) }
        return_settlement_default: { $ref: '#/components/schemas/ReturnRefundMode', description: 'S16 default settlement of a sales return (0.9.2: refund → cash / bank_transfer)' }
        credit_note_rounding: { $ref: '#/components/schemas/CreditNoteRounding', description: SalesPolicy }
        round_off_to: { type: string, enum: ['0.01', '0.10', '0.50', '1.00'], description: 'gst_config.round_off_to (S8; default 1.00 = nearest rupee)' }
        pan_required_above: { $ref: '#/components/schemas/Money', description: 'setting sales.pan_required_above (S10; default 200000.00): PAN needed when invoice_total exceeds it' }
        cash_limit_amount: { $ref: '#/components/schemas/Money', description: 'setting sales.cash_limit_amount (S11; per shop; default 200000.00, s.269ST): cash on one bill (at issue + all later receipts) >= this amount triggers cash_limit_mode' }
        cash_limit_mode: { $ref: '#/components/schemas/CashLimitMode', description: 'setting sales.cash_limit_mode (S11), per shop; default block: cash on one bill >= cash_limit_amount → 422 cash_limit_exceeded; warn → cash_limit_exceeded warning only' }
        discount_max_pct: { $ref: '#/components/schemas/Percent', description: 'setting sales.discount.max_pct (S7), per shop; default 10: line or bill discount above this % of value needs sales.price.override_min' }
        large_discount_pct: { $ref: '#/components/schemas/Percent', description: 'setting sales.discount.large_pct (S7), per shop; default 5: a discount at or above this % adds a large_discount warning and is listed in the owner daily summary' }
        default_paper: { $ref: '#/components/schemas/SalesPaperFormat' }
        print_language: { $ref: '#/components/schemas/SalesPrintLanguage', readOnly: true, description: 'Effective invoice branding template setting; edit via create/activate print-template, not SalesSettingsPatch.' }
        print_numerals: { $ref: '#/components/schemas/NumeralSystem' }
        zero_gst_print_note: { type: string, description: 'setting sales.zero_gst_print_note: note printed on 0% GST bills before the reason' }
        estimate_validity_days: { type: integer, minimum: 0, maximum: 30, description: 'setting sales.estimate_validity_days per shop; default 0 = valid until end of the IST day' }
        old_gold_enabled: { type: boolean, description: 'S6: old gold may be taken on bills' }
        estimate_no_format: { type: string, description: 'Estimate number format, tokens {BRANCH} {FY} {SEQ:n} (default EST-{BRANCH}-{FY}-{SEQ:5})' }
        receipt_no_format: { type: string, description: 'Payment receipt number format (default RCT-{BRANCH}-{FY}-{SEQ:5})' }
        version: { type: integer, minimum: 0, description: 'ETag / If-Match of PATCH /v1/sales/settings; 0 = never saved (defaults in force)' }
    SalesSettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 'Partial update of the shop''s Sales settings (0.9.2). Any subset; unknown fields → 422 field_not_supported.'
      properties:
        making_gst_treatment: { $ref: '#/components/schemas/MakingGstTreatment' }
        making_tax_rule_code: { type: [string, 'null'], minLength: 1, maxLength: 40 }
        making_service_rate: { oneOf: [{ $ref: '#/components/schemas/TaxRate' }, { type: 'null' }], description: '> 0, must split into equal CGST / SGST halves (e.g. 18.00, 5.00); null = unset (separate making then cannot bill)' }
        old_gold_enabled: { type: boolean }
        old_gold_valuation_basis: { $ref: '#/components/schemas/OldGoldValuationBasis' }
        old_gold_excess_handling: { $ref: '#/components/schemas/OldGoldExcessHandling' }
        return_window_days: { type: integer, minimum: 0, maximum: 365 }
        return_settlement_default: { $ref: '#/components/schemas/ReturnRefundMode' }
        credit_note_rounding: { $ref: '#/components/schemas/CreditNoteRounding' }
        pan_required_above: { $ref: '#/components/schemas/Money' }
        cash_limit_amount: { $ref: '#/components/schemas/Money' }
        cash_limit_mode: { $ref: '#/components/schemas/CashLimitMode' }
        discount_max_pct: { $ref: '#/components/schemas/Percent' }
        large_discount_pct: { $ref: '#/components/schemas/Percent', description: 'must be ≤ discount_max_pct' }
        default_paper: { $ref: '#/components/schemas/SalesPaperFormat' }
        zero_gst_print_note: { type: string, minLength: 1, maxLength: 200 }
        estimate_validity_days: { type: integer, minimum: 0, maximum: 30 }
        estimate_no_format: { type: string, maxLength: 64, description: 'one {SEQ} / {SEQ:n} at the end; tokens {BRANCH}, {FY}' }
        receipt_no_format: { type: string, maxLength: 64 }
    BillingReadiness:
      type: object
      required: [branch_id, ready, gates, checked_at]
      properties:
        branch_id: { $ref: '#/components/schemas/Uuid' }
        ready: { type: boolean, description: true when every gate is ok }
        checked_at: { type: string, format: date-time }
        gates:
          type: array
          items:
            type: object
            required: [code, ok, detail, setting_key, settings_path]
            properties:
              code: { enum: [device_approved, todays_rates, onboarding_gst, onboarding_gst_rates, invoice_series, making_service_rate], description: 'making_service_rate (0.9.1): ok when making_gst_treatment is composite, or separate with sales.making_service_rate set' }
              ok: { type: boolean }
              detail: { type: [string, 'null'], description: 'Why not ok (e.g. missing purities for today''s rates)' }
              setting_key: { type: [string, 'null'], enum: [making_service_rate, !!null null], description: 'making_service_rate on that gate, null otherwise' }
              settings_path: { type: [string, 'null'], enum: [/v1/sales/settings, !!null null], description: 'Owner settings endpoint on the making-rate gate, null otherwise' }
    DocSeries:
      type: object
      required: [branch_id, doc_type, fy, prefix, next_no, last_issued_no, last_issued_at]
      properties:
        branch_id: { $ref: '#/components/schemas/Uuid' }
        doc_type: { enum: [tax_invoice, credit_note] }
        fy: { $ref: '#/components/schemas/FinancialYear' }
        prefix: { type: string }
        next_no: { type: integer, minimum: 1 }
        last_issued_no: { type: [string, 'null'], description: doc_no of the last document in the series }
        last_issued_at: { type: [string, 'null'], format: date-time }
    CustomerQuickAdd:
      type: object
      additionalProperties: false
      description: 'S1 quick-add by mobile; created through the Masters service inside the issuing transaction. Mobile already on a customer → 409 customer_phone_exists with existing_customer {customer_id, name} in the problem body (SalesConflictProblem) so the UI can offer "use this customer".'
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        phone: { $ref: '#/components/schemas/MastersPhoneInput' }
        gstin: { oneOf: [{ $ref: '#/components/schemas/Gstin' }, { type: 'null' }], description: 'S22: makes the bill B2B; its first two digits are the place of supply' }
        state_code: { oneOf: [{ $ref: '#/components/schemas/StateCode' }, { type: 'null' }] }
        address: { $ref: '#/components/schemas/Address' }
    SaleTagLineInput:
      type: object
      additionalProperties: false
      description: 'A tagged piece. tag_id or tag_no (one of). Weights, purity, HSN, HUID, stones, making and wastage come from the tag (Inventory); the overrides below need the listed permissions.'
      required: [kind]
      properties:
        kind: { const: tag }
        tag_id: { $ref: '#/components/schemas/Uuid' }
        tag_no: { type: string, minLength: 1, maxLength: 64, description: 'Tag number, HUID or barcode payload as scanned' }
        wastage_pct: { $ref: '#/components/schemas/Percent', description: 'Override within the tag''s min/max wastage; outside → needs sales.price.override_min' }
        mc_value: { $ref: '#/components/schemas/DecimalAmount', description: 'Override of the tag making value (same mc_type); below the tag value counts as a discount' }
        discount: { $ref: '#/components/schemas/Money', description: 'Line discount (S7), before tax; needs sales.discount.give' }
      oneOf:
        - { required: [tag_id], properties: { tag_id: { $ref: '#/components/schemas/Uuid' } } }
        - { required: [tag_no], properties: { tag_no: { type: string } } }
    SaleLooseLineInput:
      type: object
      additionalProperties: false
      description: 'S23 loose / untagged sale by weight: Inventory reduces the loose balance at (branch, counter, tray, item, purity) in the same transaction (Stock.sellLoose); not enough → 409 insufficient_loose_stock. Making / wastage default from the item / value-addition rules when omitted.'
      required: [kind, item_id, purity_id, gross_wt, net_wt]
      allOf:
        - if: { properties: { pieces: { const: 0 } } }
          then: { properties: { net_wt: { not: { pattern: '^0+(\.0+)?$' } } } }
      properties:
        kind: { const: loose }
        item_id: { $ref: '#/components/schemas/Uuid' }
        sub_item_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        purity_id: { $ref: '#/components/schemas/Uuid' }
        counter_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Loose balance location (null = branch, no counter)' }
        tray_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        pieces: { type: integer, minimum: 0, default: 0, description: 'Zero/default0 is weight-only: requires positive net weight and is preserved on the invoice and Inventory ledger.' }
        gross_wt: { allOf: [{ $ref: '#/components/schemas/Weight' }, { not: { pattern: '^0+(\.0+)?$' } }], description: 'Physical goods require positive gross weight' }
        stone_wt: { $ref: '#/components/schemas/Weight' }
        net_wt: { $ref: '#/components/schemas/Weight' }
        huid: { oneOf: [{ type: string, pattern: '^[A-Za-z0-9]{6}$' }, { type: 'null' }], description: 'Normalised to uppercase (D22)' }
        description: { type: string, maxLength: 200 }
        wastage_pct: { $ref: '#/components/schemas/Percent' }
        mc_type: { $ref: '#/components/schemas/McType' }
        mc_value: { $ref: '#/components/schemas/DecimalAmount' }
        stone_amount: { $ref: '#/components/schemas/Money' }
        hallmark_charge: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
    SaleLineInput:
      oneOf:
        - { $ref: '#/components/schemas/SaleTagLineInput' }
        - { $ref: '#/components/schemas/SaleLooseLineInput' }
      discriminator: { propertyName: kind, mapping: { tag: '#/components/schemas/SaleTagLineInput', loose: '#/components/schemas/SaleLooseLineInput' } }
    OldGoldInput:
      type: object
      additionalProperties: false
      description: 'S6 old gold taken in exchange on the same bill. The buy-back rate is server-set by default (rate_override below, 0.9.1): today''s old-metal rate (Rates) for the purity (stated_purity) or 24K (fine_24k), snapshotted on the bill. Received into stock through Inventory (Stock.oldMetalIn). The rate_override rule applies wherever OldGoldInput is accepted (issue, preview, estimates).'
      required: [purity_id, gross_wt]
      properties:
        purity_id: { $ref: '#/components/schemas/Uuid' }
        description: { type: string, maxLength: 200 }
        gross_wt: { $ref: '#/components/schemas/Weight' }
        less_wt: { $ref: '#/components/schemas/Weight', description: 'Dust / stone / less weight; default 0.000' }
        touch_pct: { $ref: '#/components/schemas/Percent', description: 'Tested purity %; default = the purity''s fineness / 10' }
        rate_override: { $ref: '#/components/schemas/Rate', description: '0.9.1: optional override of the server buy-back rate (₹/g on the valuation basis). Needs sales.old_gold.rate_override (403 old_gold_rate_override_not_allowed) and override_reason; audited (sales.old_gold.rate_override: server rate, applied rate, reason).' }
        override_reason: { type: string, minLength: 5, maxLength: 200, description: 'Required with rate_override, not allowed without it' }
      dependentRequired: { rate_override: [override_reason], override_reason: [rate_override] }
    TenderInput:
      type: object
      additionalProperties: false
      required: [mode, amount]
      properties:
        mode: { $ref: '#/components/schemas/SalesTenderMode' }
        payment_mode_id: { $ref: '#/components/schemas/Uuid', description: 'masters.payment_mode row (its kind must equal mode); optional' }
        amount: { $ref: '#/components/schemas/Money', description: '> 0' }
        reference: { type: string, maxLength: 60, description: 'UTR / card approval / cheque number; required when the payment mode requires a reference' }
        card_machine_id: { $ref: '#/components/schemas/Uuid' }
        cheque_date: { type: string, format: date }
        bank_name: { type: string, maxLength: 80 }
        credit_note_id: { $ref: '#/components/schemas/Uuid', description: 'mode credit_note: the store-credit note to redeem (same customer; balance_available ≥ amount, else 409 store_credit_insufficient)' }
    EstimateRef:
      type: object
      additionalProperties: false
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1, description: 'The estimate version the bill was built from; stale → 412 version_mismatch' }
    IssueInvoiceRequest:
      type: object
      additionalProperties: false
      description: |
        No doc_no, doc_seq, doc_date, fy or number: supplying any → 422 client_supplied_doc_number / client_supplied_doc_date.
        Unknown fields → 422 field_not_supported. Exactly one of customer_id / customer. All amounts are server-computed.
      required: [branch_id, salesperson_id, lines]
      properties:
        branch_id: { $ref: '#/components/schemas/Uuid' }
        customer_id: { $ref: '#/components/schemas/Uuid' }
        customer: { $ref: '#/components/schemas/CustomerQuickAdd' }
        place_of_supply: { $ref: '#/components/schemas/StateCode', description: 'B2C only (e.g. delivery to another state); default = customer state, else the branch state. B2B: always the GSTIN state; a different value → 422 place_of_supply_conflict.' }
        salesperson_id: { $ref: '#/components/schemas/Uuid', description: 'S21 hr.staff (active, same branch); required' }
        cash_counter_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Optional; default = the counter of the session''s device, else null' }
        estimates: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/EstimateRef' }, description: 'S13: the draft estimates this bill converts (same branch; same customer when the estimate has one). They become billed in this transaction; not draft → 409 estimate_not_open. Lines are whatever this request sends.' }
        lines: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/SaleLineInput' }, description: 'The same tag twice → 422 duplicate_tag_in_bill' }
        bill_discount: { $ref: '#/components/schemas/Money', description: 'S7 bill-level discount; allocated to lines pro rata to their value before tax (paisa allocated by largest fractional remainder; first line wins ties), so it lowers taxable value' }
        discount_reason: { type: string, minLength: 3, maxLength: 200, description: Required when any discount needs sales.price.override_min }
        old_metal: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/OldGoldInput' } }
        old_gold_excess_payout: { $ref: '#/components/schemas/OldGoldPayoutMode', description: 'When old gold exceeds the invoice total and the policy is refund_on_bill: how the excess is paid out (required then, 422 old_gold_payout_required). Policy separate_purchase → 422 old_gold_exceeds_bill (S33 Purchases).' }
        payments: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/TenderInput' }, description: 'S9 split payments at issue; may be less than net_payable (part-paid; no extra permission; balance_due tracked). Empty / zero with net_payable > 0 = credit sale: needs sales.invoice.credit_sale (403 credit_sale_not_allowed). More than net_payable → 422 overpayment.' }
        pan: { $ref: '#/components/schemas/Pan', description: 'S10: needed only when invoice_total > pan_required_above and the customer has no PAN on file (else 422 pan_required). Write-only: stored encrypted on the customer through Masters; never returned, logged or audited. Aadhaar is never accepted.' }
        zero_gst: { type: object, additionalProperties: false, required: [reason], description: 'S17: bill at 0% GST. Needs sales.invoice.zero_gst (403 zero_gst_not_allowed); reason printed with the shop''s zero_gst_print_note and audited (sales.invoice.zero_gst).', properties: { reason: { type: string, minLength: 5, maxLength: 200 } } }
        expected_total: { $ref: '#/components/schemas/Money', description: 'Optional: the net_payable the client showed; any difference → 422 expected_total_mismatch (detail carries the server figure; re-run /preview)' }
      oneOf:
        - { required: [customer_id], properties: { customer_id: { $ref: '#/components/schemas/Uuid' } } }
        - { required: [customer], properties: { customer: { $ref: '#/components/schemas/CustomerQuickAdd' } } }
    PreviewBillRequest:
      type: object
      additionalProperties: false
      description: 'IssueInvoiceRequest plus mode (0.9.2). mode estimate: customer_id / customer and salesperson_id optional (at most one of customer_id / customer).'
      required: [branch_id, lines]
      properties:
        mode: { enum: [invoice, estimate], default: invoice }
        branch_id: { $ref: '#/components/schemas/Uuid' }
        customer_id: { $ref: '#/components/schemas/Uuid' }
        customer: { $ref: '#/components/schemas/CustomerQuickAdd' }
        place_of_supply: { $ref: '#/components/schemas/StateCode', description: 'B2C only (e.g. delivery to another state); default = customer state, else the branch state. B2B: always the GSTIN state; a different value → 422 place_of_supply_conflict.' }
        salesperson_id: { $ref: '#/components/schemas/Uuid', description: 'S21 hr.staff (active, same branch); required' }
        cash_counter_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Optional; default = the counter of the session''s device, else null' }
        estimates: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/EstimateRef' }, description: 'S13: the draft estimates this bill converts (same branch; same customer when the estimate has one). They become billed in this transaction; not draft → 409 estimate_not_open. Lines are whatever this request sends.' }
        lines: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/SaleLineInput' }, description: 'The same tag twice → 422 duplicate_tag_in_bill' }
        bill_discount: { $ref: '#/components/schemas/Money', description: 'S7 bill-level discount; allocated to lines pro rata to their value before tax (paisa allocated by largest fractional remainder; first line wins ties), so it lowers taxable value' }
        discount_reason: { type: string, minLength: 3, maxLength: 200, description: Required when any discount needs sales.price.override_min }
        old_metal: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/OldGoldInput' } }
        old_gold_excess_payout: { $ref: '#/components/schemas/OldGoldPayoutMode', description: 'When old gold exceeds the invoice total and the policy is refund_on_bill: how the excess is paid out (required then, 422 old_gold_payout_required). Policy separate_purchase → 422 old_gold_exceeds_bill (S33 Purchases).' }
        payments: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/TenderInput' }, description: 'S9 split payments at issue; may be less than net_payable (part-paid; no extra permission; balance_due tracked). Empty / zero with net_payable > 0 = credit sale: needs sales.invoice.credit_sale (403 credit_sale_not_allowed). More than net_payable → 422 overpayment.' }
        pan: { $ref: '#/components/schemas/Pan', description: 'S10: needed only when invoice_total > pan_required_above and the customer has no PAN on file (else 422 pan_required). Write-only: stored encrypted on the customer through Masters; never returned, logged or audited. Aadhaar is never accepted.' }
        zero_gst: { type: object, additionalProperties: false, required: [reason], description: 'S17: bill at 0% GST. Needs sales.invoice.zero_gst (403 zero_gst_not_allowed); reason printed with the shop''s zero_gst_print_note and audited (sales.invoice.zero_gst).', properties: { reason: { type: string, minLength: 5, maxLength: 200 } } }
        expected_total: { $ref: '#/components/schemas/Money', description: 'Optional: the net_payable the client showed; any difference → 422 expected_total_mismatch (detail carries the server figure; re-run /preview)' }
      not: { required: [customer_id, customer], properties: { customer_id: { $ref: '#/components/schemas/Uuid' }, customer: { $ref: '#/components/schemas/CustomerQuickAdd' } } }
    EstimateRequest:
      type: object
      additionalProperties: false
      description: 'Bill shape without payments, PAN, zero_gst, estimates or expected_total. Customer optional (walk-in estimate).'
      required: [branch_id, lines]
      properties:
        branch_id: { $ref: '#/components/schemas/Uuid' }
        customer_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        place_of_supply: { $ref: '#/components/schemas/StateCode' }
        salesperson_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        lines: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/SaleLineInput' } }
        bill_discount: { $ref: '#/components/schemas/Money' }
        discount_reason: { type: string, minLength: 3, maxLength: 200 }
        old_metal: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/OldGoldInput' } }
        valid_until: { type: string, format: date, description: 'IST date; default per estimate_validity_days' }
        notes: { type: string, maxLength: 500 }
    TaxPart:
      type: object
      description: 'One tax component of one line, as applied (snapshot of the rule). Each of cgst / sgst / igst / cess is computed on taxable_value and rounded to 0.01 half-up on its own (S8, D34).'
      required: [component, tax_rule_id, hsn_sac, composite_supply, taxable_value, rate, cgst_rate, sgst_rate, igst_rate, cess_rate, cgst, sgst, igst, cess]
      properties:
        component: { $ref: '#/components/schemas/SaleTaxComponent' }
        tax_rule_id: { $ref: '#/components/schemas/Uuid' }
        hsn_sac: { type: string, pattern: '^[0-9]{4,8}$' }
        composite_supply: { type: boolean }
        taxable_value: { $ref: '#/components/schemas/Money' }
        rate: { $ref: '#/components/schemas/TaxRate' }
        cgst_rate: { $ref: '#/components/schemas/TaxRate' }
        sgst_rate: { $ref: '#/components/schemas/TaxRate' }
        igst_rate: { $ref: '#/components/schemas/TaxRate' }
        cess_rate: { $ref: '#/components/schemas/TaxRate' }
        cgst: { $ref: '#/components/schemas/Money' }
        sgst: { $ref: '#/components/schemas/Money' }
        igst: { $ref: '#/components/schemas/Money' }
        cess: { $ref: '#/components/schemas/Money' }
    PricedLine:
      type: object
      description: 'S3/S4 one bill line with every price input frozen (rate, MC, wastage, HSN, HUID). gross_value = metal_value + mc_amount + stone_amount + hallmark_charge; taxable_value = gross_value − discount; line_total = taxable_value + cgst + sgst + igst + cess.'
      required: [line_no, kind, tag_id, tag_no, item_id, sub_item_id, purity_id, description, purity_code, fineness, hsn, huid, pieces, gross_wt, stone_wt, net_wt, wastage_pct, wastage_wt, chargeable_wt, rate_id, rate_per_g, metal_value, mc_type, mc_value, mc_amount, stone_amount, hallmark_charge, gross_value, discount, bill_discount_share, taxable_value, tax_rate, cgst, sgst, igst, cess, line_total, tax_parts, stones, counter_id, tray_id]
      properties:
        line_no: { type: integer, minimum: 1 }
        kind: { $ref: '#/components/schemas/InvoiceLineKind' }
        tag_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        tag_no: { type: [string, 'null'] }
        item_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        sub_item_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        purity_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        description: { type: string }
        purity_code: { type: [string, 'null'] }
        fineness: { oneOf: [{ $ref: '#/components/schemas/Fineness' }, { type: 'null' }] }
        hsn: { type: string, pattern: '^[0-9]{4,8}$' }
        huid: { type: [string, 'null'], pattern: '^[A-Z0-9]{6}$' }
        pieces: { type: integer, minimum: 0 }
        gross_wt: { $ref: '#/components/schemas/Weight' }
        stone_wt: { $ref: '#/components/schemas/Weight' }
        net_wt: { $ref: '#/components/schemas/Weight' }
        wastage_pct: { $ref: '#/components/schemas/Percent' }
        wastage_wt: { $ref: '#/components/schemas/Weight' }
        chargeable_wt: { oneOf: [{ $ref: '#/components/schemas/Weight' }, { type: 'null' }], description: net_wt + wastage_wt }
        rate_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        rate_per_g: { $ref: '#/components/schemas/Rate' }
        metal_value: { $ref: '#/components/schemas/Money' }
        mc_type: { oneOf: [{ $ref: '#/components/schemas/McType' }, { type: 'null' }] }
        mc_value: { oneOf: [{ $ref: '#/components/schemas/DecimalAmount' }, { type: 'null' }] }
        mc_amount: { $ref: '#/components/schemas/Money' }
        stone_amount: { $ref: '#/components/schemas/Money' }
        hallmark_charge: { $ref: '#/components/schemas/Money' }
        gross_value: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        discount: { $ref: '#/components/schemas/Money', description: Line discount + bill_discount_share }
        bill_discount_share: { $ref: '#/components/schemas/Money' }
        taxable_value: { $ref: '#/components/schemas/Money' }
        tax_rate: { $ref: '#/components/schemas/TaxRate', description: 'Principal rate of the line (the metal part); 0.00 on a zero-GST bill' }
        cgst: { $ref: '#/components/schemas/Money', description: Sum of the line's rounded tax_parts }
        sgst: { $ref: '#/components/schemas/Money' }
        igst: { $ref: '#/components/schemas/Money' }
        cess: { $ref: '#/components/schemas/Money' }
        line_total: { $ref: '#/components/schemas/Money' }
        tax_parts: { type: array, minItems: 1, items: { $ref: '#/components/schemas/TaxPart' }, description: 'S5/S8: metal always; making as its own part (composite_supply true + metal HSN/rate when composite, else the separate service rule); stone / hallmark parts when non-zero' }
        stones:
          type: array
          items:
            type: object
            required: [description, pieces, weight, unit, amount]
            properties:
              description: { type: string }
              pieces: { type: integer, minimum: 0 }
              weight: { type: string, pattern: '^[0-9]{1,9}\.[0-9]{3}$' }
              unit: { enum: [g, ct] }
              amount: { $ref: '#/components/schemas/Money' }
        counter_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Where the piece / loose weight was sold from (restock target on cancel / return)' }
        tray_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
    InvoiceLine:
      allOf:
        - { $ref: '#/components/schemas/PricedLine' }
        - type: object
          required: [id, credit_note_id]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            credit_note_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Credit note that took this line back (cancellation or return); null while sold' }
    PricedOldGold:
      type: object
      required: [line_no, purity_id, purity_code, description, gross_wt, less_wt, net_wt, touch_pct, fine_wt, valuation_basis, rate_id, server_rate, rate_per_g, overridden, override_reason, amount]
      properties:
        line_no: { type: integer, minimum: 1 }
        purity_id: { $ref: '#/components/schemas/Uuid' }
        purity_code: { type: string }
        description: { type: [string, 'null'] }
        gross_wt: { $ref: '#/components/schemas/Weight' }
        less_wt: { $ref: '#/components/schemas/Weight' }
        net_wt: { $ref: '#/components/schemas/Weight' }
        touch_pct: { $ref: '#/components/schemas/Percent' }
        fine_wt: { $ref: '#/components/schemas/Weight', description: 'net_wt × touch_pct / 100, 3 dp half-up' }
        valuation_basis: { $ref: '#/components/schemas/OldGoldValuationBasis' }
        rate_id: { $ref: '#/components/schemas/Uuid' }
        server_rate: { $ref: '#/components/schemas/Rate', description: 'Today''s old-metal buy-back rate set by the server (purity rate for stated_purity, 24K rate for fine_24k; rate_id)' }
        rate_per_g: { $ref: '#/components/schemas/Rate', description: 'The applied rate: rate_override when overridden, else server_rate' }
        overridden: { type: boolean }
        override_reason: { type: [string, 'null'], description: null unless overridden }
        amount: { $ref: '#/components/schemas/Money', description: 'stated_purity: net_wt × rate; fine_24k: fine_wt × rate; 0.01 half-up' }
    RateUsed:
      type: object
      required: [kind, metal_id, purity_id, purity_code, rate_id, rate_per_g, effective_from]
      properties:
        kind: { enum: [sale, old_metal] }
        metal_id: { $ref: '#/components/schemas/Uuid' }
        purity_id: { $ref: '#/components/schemas/Uuid' }
        purity_code: { type: string }
        rate_id: { $ref: '#/components/schemas/Uuid' }
        rate_per_g: { $ref: '#/components/schemas/Rate' }
        effective_from: { type: string, format: date-time }
    TaxSummaryRow:
      type: object
      description: 'GST breakup for print / GSTR-1 (S19): rounded line parts summed by hsn_sac + rate. Never re-rounded.'
      required: [hsn_sac, rate, taxable_value, cgst, sgst, igst, cess]
      properties:
        hsn_sac: { type: string }
        rate: { $ref: '#/components/schemas/TaxRate' }
        taxable_value: { $ref: '#/components/schemas/Money' }
        cgst: { $ref: '#/components/schemas/Money' }
        sgst: { $ref: '#/components/schemas/Money' }
        igst: { $ref: '#/components/schemas/Money' }
        cess: { $ref: '#/components/schemas/Money' }
    BillTotals:
      type: object
      description: |
        gross_value − line_discount − bill_discount = taxable_value; tax_total = cgst + sgst + igst + cess (sums of the rounded line parts);
        invoice_total = taxable_value + tax_total + round_off (round_off per round_off_to, may be negative);
        net_payable = max(invoice_total − old_metal_value, 0); old_gold_excess = max(old_metal_value − invoice_total, 0);
        paid_amount + balance_due = net_payable. All decimal strings.
      required: [gross_value, line_discount, bill_discount, taxable_value, cgst, sgst, igst, cess, tax_total, round_off, invoice_total, old_metal_value, old_gold_excess, net_payable, paid_amount, balance_due, cash_amount]
      properties:
        gross_value: { $ref: '#/components/schemas/Money' }
        line_discount: { $ref: '#/components/schemas/Money' }
        bill_discount: { $ref: '#/components/schemas/Money' }
        taxable_value: { $ref: '#/components/schemas/Money' }
        cgst: { $ref: '#/components/schemas/Money' }
        sgst: { $ref: '#/components/schemas/Money' }
        igst: { $ref: '#/components/schemas/Money' }
        cess: { $ref: '#/components/schemas/Money' }
        tax_total: { $ref: '#/components/schemas/Money' }
        round_off: { $ref: '#/components/schemas/Money' }
        invoice_total: { $ref: '#/components/schemas/Money' }
        old_metal_value: { $ref: '#/components/schemas/Money' }
        old_gold_excess: { $ref: '#/components/schemas/Money' }
        net_payable: { $ref: '#/components/schemas/Money' }
        paid_amount: { $ref: '#/components/schemas/Money', description: 'On an Invoice: at issue + later receipts − refunds of returns; on a computation: the request payments' }
        balance_due: { $ref: '#/components/schemas/Money' }
        cash_amount: { $ref: '#/components/schemas/Money', description: 'Cash tendered on the bill (S11 counts this, receipts included)' }
    BillRequirements:
      type: object
      description: What an issue of this request would need (preview / estimate). Issue fails on an unmet one.
      required: [pan_required, pan_on_file, cash_limit, discount_permission, override_min_permission, zero_gst_permission, credit_sale_permission, old_gold_rate_override_permission]
      properties:
        pan_required: { type: boolean, description: 'invoice_total > pan_required_above' }
        pan_on_file: { type: boolean }
        cash_limit:
          type: object
          required: [limit, mode, cash_amount, exceeded]
          properties:
            limit: { $ref: '#/components/schemas/Money' }
            mode: { $ref: '#/components/schemas/CashLimitMode' }
            cash_amount: { $ref: '#/components/schemas/Money' }
            exceeded: { type: boolean, description: 'cash_amount (cash on one bill, receipts included) >= limit' }
        discount_permission: { type: boolean, description: 'A discount is present (needs sales.discount.give)' }
        override_min_permission: { type: boolean, description: 'Below tag minimum / wastage range / above discount_max_pct (needs sales.price.override_min + discount_reason)' }
        zero_gst_permission: { type: boolean }
        credit_sale_permission: { type: boolean, description: '0.9.1: net_payable > 0 and nothing paid (credit sale) → needs sales.invoice.credit_sale; false when anything is paid (part-paid needs nothing extra)' }
        old_gold_rate_override_permission: { type: boolean, description: '0.9.1: an old_metal row has rate_override → needs sales.old_gold.rate_override' }
    CustomerSnapshot:
      type: object
      description: Frozen at issue (never re-read from Masters). PAN only as pan_on_file + pan_last4; full PAN via masters KYC reveal. No Aadhaar.
      required: [customer_id, name, phone, gstin, state_code, address, pan_on_file, pan_last4]
      properties:
        customer_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        name: { type: string }
        phone: { oneOf: [{ $ref: '#/components/schemas/MastersPhone' }, { type: 'null' }] }
        gstin: { oneOf: [{ $ref: '#/components/schemas/Gstin' }, { type: 'null' }] }
        state_code: { oneOf: [{ $ref: '#/components/schemas/StateCode' }, { type: 'null' }] }
        address: { oneOf: [{ $ref: '#/components/schemas/Address' }, { type: 'null' }] }
        pan_on_file: { type: boolean }
        pan_last4: { type: [string, 'null'] }
    SellerSnapshot:
      type: object
      required: [company_id, legal_name, gstin, state_code, address]
      properties:
        company_id: { $ref: '#/components/schemas/Uuid' }
        legal_name: { type: string }
        gstin: { oneOf: [{ $ref: '#/components/schemas/Gstin' }, { type: 'null' }] }
        state_code: { $ref: '#/components/schemas/StateCode' }
        address: { oneOf: [{ $ref: '#/components/schemas/Address' }, { type: 'null' }] }
    BillComputation:
      type: object
      description: Server computation of a bill / estimate request (no number, nothing written).
      required: [branch_id, supply_type, gst_type, place_of_supply, seller, customer, making_gst_treatment, zero_gst, rates_used, lines, old_metal, tax_summary, totals, requirements, warnings, computed_at]
      properties:
        branch_id: { $ref: '#/components/schemas/Uuid' }
        supply_type: { $ref: '#/components/schemas/SupplyType' }
        gst_type: { $ref: '#/components/schemas/GstType' }
        place_of_supply: { $ref: '#/components/schemas/StateCode' }
        seller: { $ref: '#/components/schemas/SellerSnapshot' }
        customer: { oneOf: [{ $ref: '#/components/schemas/CustomerSnapshot' }, { type: 'null' }] }
        making_gst_treatment: { $ref: '#/components/schemas/MakingGstTreatment' }
        zero_gst: { type: boolean }
        rates_used: { type: array, items: { $ref: '#/components/schemas/RateUsed' } }
        lines: { type: array, items: { $ref: '#/components/schemas/PricedLine' } }
        old_metal: { type: array, items: { $ref: '#/components/schemas/PricedOldGold' } }
        tax_summary: { type: array, items: { $ref: '#/components/schemas/TaxSummaryRow' } }
        totals: { $ref: '#/components/schemas/BillTotals' }
        requirements: { $ref: '#/components/schemas/BillRequirements' }
        warnings: { type: array, items: { $ref: '#/components/schemas/SalesWarning' } }
        computed_at: { type: string, format: date-time }
    SellableTag:
      type: object
      required: [tag_id, tag_no, status, branch_id, line, warnings]
      properties:
        tag_id: { $ref: '#/components/schemas/Uuid' }
        tag_no: { type: string }
        status: { const: in_stock }
        branch_id: { $ref: '#/components/schemas/Uuid' }
        line: { $ref: '#/components/schemas/PricedLine', description: 'Priced at today''s rate as an intra-state line with no discount (line_no 1); the bill''s GST type may change the split' }
        warnings: { type: array, items: { $ref: '#/components/schemas/SalesWarning' } }
    Tender:
      type: object
      required: [line_no, mode, payment_mode_id, amount, reference, card_machine_id, cheque_date, bank_name, credit_note_id]
      properties:
        line_no: { type: integer, minimum: 1 }
        mode: { $ref: '#/components/schemas/SalesPaymentMode' }
        payment_mode_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        amount: { $ref: '#/components/schemas/Money' }
        reference: { type: [string, 'null'], description: 'mode advance: the advance receipt number (ADV-...)' }
        card_machine_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        cheque_date: { type: [string, 'null'], format: date }
        bank_name: { type: [string, 'null'] }
        credit_note_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
    PaymentReceiptRequest:
      type: object
      additionalProperties: false
      required: [tenders]
      properties:
        tenders: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/TenderInput' } }
        note: { type: string, maxLength: 300 }
    PaymentReceipt:
      type: object
      description: 'A later payment against a bill (S9), or (0.9.2) its reversal: reverses_receipt_id set, total negative, no tenders. receipt_no is from the non-gapless receipt counter of the branch.'
      required: [id, receipt_no, invoice_id, invoice_no, branch_id, customer_id, received_on, received_at, received_by, tenders, total, balance_due_after, adjusted_balance_due_after, note, reverses_receipt_id, reversed_by_receipt_id, reversal_reason]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        receipt_no: { type: string }
        invoice_id: { $ref: '#/components/schemas/Uuid' }
        invoice_no: { type: string }
        branch_id: { $ref: '#/components/schemas/Uuid' }
        received_on: { type: string, format: date, description: IST date }
        received_at: { type: string, format: date-time }
        received_by: { $ref: '#/components/schemas/Uuid' }
        tenders: { type: array, items: { $ref: '#/components/schemas/Tender' } }
        total: { $ref: '#/components/schemas/Money' }
        balance_due_after: { $ref: '#/components/schemas/Money', deprecated: true, description: 'Legacy alias of adjusted_balance_due_after; present-adjusted, NOT immutable as-at receipt history' }
        adjusted_balance_due_after: { $ref: '#/components/schemas/Money', description: 'Original due minus receipts through this receipt and ALL current return due reductions; changes after later returns. Not an as-at historical balance.' }
        note: { type: [string, 'null'] }
        customer_id: { $ref: '#/components/schemas/Uuid' }
        reverses_receipt_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Set on a reversal: the receipt it reverses' }
        reversed_by_receipt_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Set on a receipt that was reversed' }
        reversal_reason: { type: [string, 'null'] }
    PaymentReceiptPrintSnapshot:
      type: object
      description: 'Immutable receipt issue data, not the live balance aliases. Seller/customer from original invoice snapshot; receipt-time adjusted balance from append-only audit. Later returns/receipts/masters/reversals leave this projection identical.'
      required: [id, receipt_no, invoice_id, invoice_no, invoice_date, branch_id, customer_id, customer, seller, received_on, received_at, received_by, tenders, total, adjusted_balance_due_at_issue, note, reverses_receipt_id, reversal_reason, kind]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        receipt_no: { type: string }
        invoice_id: { $ref: '#/components/schemas/Uuid' }
        invoice_no: { type: string }
        invoice_date: { type: string, format: date }
        branch_id: { $ref: '#/components/schemas/Uuid' }
        customer_id: { $ref: '#/components/schemas/Uuid' }
        customer: { $ref: '#/components/schemas/CustomerSnapshot' }
        seller: { $ref: '#/components/schemas/SellerSnapshot' }
        received_on: { type: string, format: date }
        received_at: { type: string, format: date-time }
        received_by: { $ref: '#/components/schemas/Uuid' }
        tenders: { type: array, items: { $ref: '#/components/schemas/Tender' } }
        total: { $ref: '#/components/schemas/Money' }
        adjusted_balance_due_at_issue: { $ref: '#/components/schemas/Money', description: 'Immediately after THIS receipt; never recalculated using later returns/reversals' }
        note: { type: [string, 'null'] }
        reverses_receipt_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        reversal_reason: { type: [string, 'null'] }
        kind: { enum: [collection, reversal] }
    ReceiptReversalRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 200, description: 'Trimmed 5-200 chars; audited' }
    ReceiptReversal:
      type: object
      required: [reversal, store_credit_note]
      properties:
        reversal: { $ref: '#/components/schemas/PaymentReceipt' }
        store_credit_note: { oneOf: [{ $ref: '#/components/schemas/CreditNote' }, { type: 'null' }], description: 'The NEW credit note (kind receipt_reversal) for the store credit the reversed receipt spent; null when it had no credit_note tenders' }
    InvoicePayments:
      type: object
      required: [invoice_id, net_payable, at_issue, receipts, refunds, paid_amount, balance_due, payment_status]
      properties:
        invoice_id: { $ref: '#/components/schemas/Uuid' }
        net_payable: { $ref: '#/components/schemas/Money' }
        at_issue: { type: array, items: { $ref: '#/components/schemas/Tender' } }
        receipts: { type: array, items: { $ref: '#/components/schemas/PaymentReceipt' } }
        refunds: { type: array, items: { $ref: '#/components/schemas/CreditNoteRefund' } }
        paid_amount: { $ref: '#/components/schemas/Money' }
        balance_due: { $ref: '#/components/schemas/Money' }
        payment_status: { $ref: '#/components/schemas/PaymentStatus' }
    Invoice:
      type: object
      description: 'Issued tax invoice (S1-S23). Immutable; paid_amount / balance_due / payment_status reflect later receipts and returns (computed). Amounts in totals.'
      required: [id, doc_no, doc_seq, fy, doc_date, issued_at, status, branch_id, supply_type, gst_type, place_of_supply, seller, customer, salesperson_id, cash_counter_id, making_gst_treatment, zero_gst, zero_gst_reason, rates_used, lines, old_metal, old_gold_excess_payout, tax_summary, totals, payments, payment_status, estimate_ids, credit_note_ids, cancelled_at, cancel_credit_note_id, print_count, last_printed_at, warnings, created_by]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        doc_no: { type: string, maxLength: 16, pattern: '^[A-Za-z0-9/-]{1,16}$', readOnly: true, description: 'Server-assigned (INV-1), ≤ 16 chars as GST requires: "{branch prefix}/{FY yyyy-yy as yyyy}/{seq}", e.g. CBE/2627/000041' }
        doc_seq: { type: integer, minimum: 1, readOnly: true }
        fy: { $ref: '#/components/schemas/FinancialYear' }
        doc_date: { type: string, format: date, readOnly: true, description: Server date in Asia/Kolkata at issue (D29) }
        issued_at: { type: string, format: date-time, readOnly: true }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        branch_id: { $ref: '#/components/schemas/Uuid' }
        supply_type: { $ref: '#/components/schemas/SupplyType' }
        gst_type: { $ref: '#/components/schemas/GstType' }
        place_of_supply: { $ref: '#/components/schemas/StateCode' }
        seller: { $ref: '#/components/schemas/SellerSnapshot' }
        customer: { $ref: '#/components/schemas/CustomerSnapshot' }
        salesperson_id: { $ref: '#/components/schemas/Uuid' }
        cash_counter_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        making_gst_treatment: { $ref: '#/components/schemas/MakingGstTreatment' }
        zero_gst: { type: boolean }
        zero_gst_reason: { type: [string, 'null'] }
        rates_used: { type: array, items: { $ref: '#/components/schemas/RateUsed' }, description: S4 the rates the bill used (printed as the rate of the day) }
        lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/InvoiceLine' } }
        old_metal: { type: array, items: { $ref: '#/components/schemas/PricedOldGold' } }
        old_gold_excess_payout: { type: [string, 'null'], enum: [cash, bank_transfer, !!null null] }
        tax_summary: { type: array, items: { $ref: '#/components/schemas/TaxSummaryRow' } }
        totals: { $ref: '#/components/schemas/BillTotals' }
        payments: { type: array, items: { $ref: '#/components/schemas/Tender' }, description: Tenders at issue (later receipts in GET /payments) }
        payment_status: { $ref: '#/components/schemas/PaymentStatus' }
        estimate_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        credit_note_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        cancelled_at: { type: [string, 'null'], format: date-time }
        cancel_credit_note_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        print_count: { type: integer, minimum: 0 }
        last_printed_at: { type: [string, 'null'], format: date-time }
        warnings: { type: array, items: { $ref: '#/components/schemas/SalesWarning' }, description: 'Non-blocking notices recorded at issue (e.g. cash_limit_exceeded in warn mode)' }
        created_by: { $ref: '#/components/schemas/Uuid' }
    InvoiceSummary:
      type: object
      required: [id, doc_no, doc_date, issued_at, branch_id, status, payment_status, supply_type, customer_id, customer_name, customer_phone, salesperson_id, line_count, taxable_value, tax_total, invoice_total, net_payable, paid_amount, balance_due]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        doc_no: { type: string }
        doc_date: { type: string, format: date }
        issued_at: { type: string, format: date-time }
        branch_id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        payment_status: { $ref: '#/components/schemas/PaymentStatus' }
        supply_type: { $ref: '#/components/schemas/SupplyType' }
        customer_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        customer_name: { type: string }
        customer_phone: { oneOf: [{ $ref: '#/components/schemas/MastersPhone' }, { type: 'null' }] }
        salesperson_id: { $ref: '#/components/schemas/Uuid' }
        line_count: { type: integer, minimum: 1 }
        taxable_value: { $ref: '#/components/schemas/Money' }
        tax_total: { $ref: '#/components/schemas/Money' }
        invoice_total: { $ref: '#/components/schemas/Money' }
        net_payable: { $ref: '#/components/schemas/Money' }
        paid_amount: { $ref: '#/components/schemas/Money' }
        balance_due: { $ref: '#/components/schemas/Money' }
    InvoiceSummaryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InvoiceSummary' } }
        next_cursor: { type: [string, 'null'] }
    CancelInvoiceRequest:
      type: object
      additionalProperties: false
      required: [reason, refund_mode]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500, description: 'Trimmed ≥ 5 chars (DB check); in the INV-5 alert' }
