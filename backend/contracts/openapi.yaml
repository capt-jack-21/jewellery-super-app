        description: {type: [string, 'null']}
        gross_wt: {$ref: '#/components/schemas/Weight'}
        net_wt: {oneOf: [{$ref: '#/components/schemas/Weight'}, {type: 'null'}]}
        customer_charge: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}], description: 'The estimate'}
        photo_file_ids: {type: array, items: {$ref: '#/components/schemas/Uuid'}}
        vendor_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}], description: 'Set when the line is issued to a vendor'}
        vendor_charge: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
