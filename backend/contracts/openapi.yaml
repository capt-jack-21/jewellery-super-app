    StockAdjustmentStatus:
      enum: [pending, approved, rejected, cancelled]
      description: approved = applied (deltas are applied in the approving transaction)
    StockAdjustmentKind:
      enum: [weight_loss, weight_gain, piece_loss, piece_gain, write_off, full_write_off, correction]
      description: 'Sign rules (DB check): weight_loss gross<0 & net≤0; weight_gain gross>0 & net≥0; piece_loss pieces<0; piece_gain pieces>0; write_off all ≤0 (partial: loose balance or part of a piece); full_write_off needs tag_id, pieces<0, gross<0, net≤0 and the deltas must equal minus the piece''s current pieces / gross / net (422 invalid_delta), and approving it sets the piece to written_off; correction any. Not all zero.'
    StockAdjustmentReasonCode:
      enum: [polishing, repair, breakage, loss, count_error, weighing_error, melting_loss, other]
    StockAdjustmentInput:
      type: object
      description: Either tag_id (piece) or item_id + purity_id (+ counter / tray) for a loose balance. Deltas default to 0. To remove a whole piece use kind full_write_off (tag_id required, deltas = minus its full pieces / weights); approval sets it to written_off. kind write_off is partial and only reduces weight / pieces and may not take a piece to zero pieces (422 use_full_write_off).
      required: [branch_id, kind, reason_code, reason]
      additionalProperties: false
      properties:
        branch_id: {$ref: '#/components/schemas/Uuid'}
        kind: {$ref: '#/components/schemas/StockAdjustmentKind'}
        tag_id:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
        item_id:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
        purity_id:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
        counter_id:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
        tray_id:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
        delta_pieces: {type: integer, default: 0}
        delta_gross_wt: {$ref: '#/components/schemas/SignedWeight'}
        delta_net_wt: {$ref: '#/components/schemas/SignedWeight'}
        reason_code: {$ref: '#/components/schemas/StockAdjustmentReasonCode'}
        reason: {type: string, minLength: 3, maxLength: 500}
    StockAdjustment:
