  # ======================= GST settings (0.4.3 implemented; 0.4.4 replace + rules documented) =======================
  # Period semantics (both tables): [effective_from, effective_to) — effective_to is EXCLUSIVE, null = open-ended.
  # A row closed at D and a successor starting at D leave no gap and no overlap (DB EXCLUDE uses daterange(from, to) &&).
  # NO BACK-DATING of tax settings (gst-config and tax-rules alike): a period can never start, or be closed, before today (IST).
  # Date rules (IST calendar date):
  #   create / replace: effective_from >= today            → 422 effective_from_in_past
  #   close:            effective_to >= today               → 422 effective_to_in_past
  #                     effective_to > effective_from       → 422 invalid_period
  #   tax_rule: also enforced by the DB trigger masters.tax_rule_guard; gst_config: enforced by the API (the DB has only the CHECK to > from).
  /v1/settings/gst-config:
    get:
      tags: [settings]
      operationId: listGstConfig
      summary: Effective-dated GST configuration rows (masters.gst_config, tenant RLS), newest effective_from first
      description: >-
        company_id filter returns rows for that company plus tenant-wide rows (company_id null).
        All rows are shop-owned: masters.gst_config.tenant_id is NOT NULL, so there are no platform-owned GST configs;
        a shop with no row has no GST config (onboarding step gst stays pending).
      parameters: [{ $ref: '#/components/parameters/CompanyId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GstConfig' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [settings]
      operationId: createGstConfig
      summary: Add a GST config period (platform.settings.edit). effective_from >= today IST — back-dating is not allowed. Marks onboarding step gst completed.
      description: Overlap with an existing period for the same company_id (null = tenant-wide is its own key) → 409 overlapping_period.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GstConfigInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/GstConfig' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/OverlappingPeriod' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/settings/gst-config/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [settings]
      operationId: closeGstConfig
      summary: Close (or move the end of) a period (platform.settings.edit). effective_to >= today IST and > effective_from. No If-Match (no version column).
      description: Moving the end later so it runs into the next period → 409 overlapping_period. Use /replace to switch config with no gap.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PeriodClose' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/GstConfig' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/OverlappingPeriod' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/settings/gst-config/{id}/replace:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
    post:
      tags: [settings]
      operationId: replaceGstConfig
      summary: Atomically end a period and start its successor (platform.settings.edit)
      description: >-
        One transaction: the old row is locked (FOR UPDATE), its effective_to is set to the new effective_from
        (exclusive end, so no gap and no overlap), and the new row is inserted with the old row's company_id.
        The new row is open-ended unless the body sets the optional effective_to; to end it later use the close PATCH.
        new effective_from must be >= today IST, > old effective_from, and <= old effective_to when the old row is already closed
        (else 422 invalid_period — it would leave a gap). Back-dating is not allowed.
        Idempotency (platform.idempotency_key, 24 h; scope = this route template; hash = path id + body): the same key and body
        replays the STORED status and body (201 with the same pair), including for a concurrent duplicate; the same key with a
        different body or another id → 422 idempotency_key_reused. Without a stored key (new key), re-sending a replace that
        already happened returns 200 with the same pair when the body matches, else 409 already_replaced.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GstConfigReplaceInput' } } } }
      responses:
        '400': { $ref: '#/components/responses/IdempotencyBadRequest' }
        '201': { description: Replaced, content: { application/json: { schema: { $ref: '#/components/schemas/GstConfigReplaced' } } } }
        '200': { description: 'Natural replay under a new key: this exact replace already happened', content: { application/json: { schema: { $ref: '#/components/schemas/GstConfigReplaced' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/OverlappingPeriod' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/settings/tax-rules:
    get:
      tags: [settings]
      operationId: listTaxRules
      summary: Tax rules visible to the tenant (platform defaults + tenant overrides)
      description: >-
        Precedence: when a shop (scope=tenant) rule and a platform rule are both live on the same day for the same
        component + metal_code + hsn_sac, the SHOP RULE WINS. This list returns both (scope tells them apart); clients and the
        M1 pricing engine must apply that precedence and never sum or pick by code.
      parameters:
        - { name: component, in: query, schema: { $ref: '#/components/schemas/TaxComponent' } }
        - { name: 'on', in: query, description: Only rules effective on this date, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TaxRule' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [settings]
      operationId: createTaxRule
      summary: Add a tenant tax rule (platform.settings.edit; CGST+SGST = rate = IGST; effective_from >= today IST — back-dating is not allowed). Marks onboarding step gst_rates completed.
      description: >-
        Overlap key (DB EXCLUDE): owner (tenant, or platform) + component + metal_code (null = any) + hsn_sac + daterange.
        code is NOT part of the key and is not unique: a tenant rule may reuse a platform rule's code (or the same
        component/HSN/dates) without conflict, because tenant and platform rows have different owners. Only another rule of
        the same shop with the same component, metal_code and hsn_sac and an overlapping period → 409 overlapping_period.
        Precedence: a live shop rule overrides a live platform rule for the same component + metal_code + hsn_sac on the same day.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaxRuleInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TaxRule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/OverlappingPeriod' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/settings/tax-rules/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [settings]
      operationId: closeTaxRule
      summary: Close (or move the end of) a tenant rule (platform.settings.edit). effective_to >= today IST and > effective_from. Platform rules → 403 platform_rule. No If-Match.
      description: >-
        If the rule is in_use (referenced by an issued invoice) the DB allows exactly one change: effective_to null → a date >= today.
        Moving an already-set end date of an in-use rule → 422 rule_in_use. Extending into the next period → 409 overlapping_period.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PeriodClose' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TaxRule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/OverlappingPeriod' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/settings/tax-rules/{id}/replace:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
    post:
      tags: [settings]
      operationId: replaceTaxRule
      summary: Atomically end a tenant rule and start its successor (rate change with no gap; platform.settings.edit)
      description: >-
        One transaction: lock the old rule (FOR UPDATE), set its effective_to = new effective_from (exclusive end), insert the
        new tenant rule with the old rule's component and metal_code (so the lookup key billing uses never has a gap).
        The new rule is open-ended unless the body sets the optional effective_to; to end it later use the close PATCH.
        Platform rule → 403 platform_rule (POST a tenant rule instead). In-use rules can be replaced only while still open-ended
        (DB: the only allowed change is effective_to null → date), else 422 rule_in_use. Same date rules (no back-dating) and replay
        semantics as replaceGstConfig (stored replay, 422 idempotency_key_reused).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaxRuleReplaceInput' } } } }
      responses:
        '400': { $ref: '#/components/responses/IdempotencyBadRequest' }
        '201': { description: Replaced, content: { application/json: { schema: { $ref: '#/components/schemas/TaxRuleReplaced' } } } }
        '200': { description: 'Natural replay under a new key: this exact replace already happened', content: { application/json: { schema: { $ref: '#/components/schemas/TaxRuleReplaced' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/OverlappingPeriod' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/masters/metals:
