      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        kind: { enum: [billing_counter, tablet, mobile, back_office], default: billing_counter }
        branch_id: { $ref: '#/components/schemas/Uuid' }
        device_key: { type: string, minLength: 32, maxLength: 128 }
    Device:
      type: object
      required: [id, name, kind, branch_id, status, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        kind: { enum: [billing_counter, tablet, mobile, back_office] }
        branch_id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/DeviceStatus' }
        requested_by: { type: [string, 'null'], format: uuid }
        approved_by: { type: [string, 'null'], format: uuid }
        approved_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        revoke_reason: { type: [string, 'null'] }
        last_seen_at: { type: [string, 'null'], format: date-time }
        live_sessions: { type: integer }
        created_at: { type: string, format: date-time }
    TenantStatus: { enum: [trial, active, read_only, suspended] }
    TenantCreated:
      description: Tenant plus the first branch as stored (bill_series_prefix is the DB's upper-cased value)
      allOf:
        - { $ref: '#/components/schemas/Tenant' }
