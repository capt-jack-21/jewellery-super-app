    post:
      tags: [orders]
      operationId: deliverRepair
      summary: "Deliver the repair and bill it as a service (orders.repair.deliver, sales.invoice.issue)"
      description: 'The repair must be ready (409 repair_not_ready). Sales issues ONE tax invoice in the same transaction with one SERVICE line per live repair line (SAC of the repair type, else 998892; GST by the REPAIR_SERVICE rule, no stock, no metal). The charge of a line is its customer_charge, or the amount in charges (inside the repair type customer limits: 422 charge_out_of_range; a line with no charge at all: 422 charge_required); a charge sent here is saved on the line. The repair''s open MONEY advances are applied as payment, oldest first, up to what is due (apply_advances false = none). payments are the rest as in POST /v1/sales/invoices (an unpaid rest becomes a credit-sale balance when the shop allows it). Any Sales refusal (device not approved, PAN, limits) comes back unchanged and leaves the repair untouched. The repair becomes delivered and carries delivered_invoice_id.'
