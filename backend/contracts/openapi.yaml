        taxable_value: { $ref: '#/components/schemas/Money' }
        cgst: { $ref: '#/components/schemas/Money' }
        sgst: { $ref: '#/components/schemas/Money' }
        igst: { $ref: '#/components/schemas/Money' }
        cess: { $ref: '#/components/schemas/Money' }
        round_off: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        refund_mode: { $ref: '#/components/schemas/RefundMode' }
        refund_amount: { $ref: '#/components/schemas/Money', description: 'Paid back now (cash / bank / reversal) or credited as store credit' }
        due_reduced: { $ref: '#/components/schemas/Money', description: 'Part of the credit that cancelled unpaid balance_due instead of a refund' }
        store_credit_amount: { $ref: '#/components/schemas/Money' }
        balance_available: { $ref: '#/components/schemas/Money', description: Store credit still usable (tender mode credit_note) }
        customer: { $ref: '#/components/schemas/CustomerSnapshot' }
        created_by: { $ref: '#/components/schemas/Uuid' }
        print_count: { type: integer, minimum: 0 }
        last_printed_at: { type: [string, 'null'], format: date-time }
        reversal_receipt_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'kind receipt_reversal: the reversal receipt this note gives store credit back for; null otherwise' }
    CreditNotePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CreditNote' } }
        next_cursor: { type: [string, 'null'] }
    Estimate:
      type: object
      description: 'S13 not a tax document. estimate_no from the branch estimate counter (gaps allowed), default format "EST-{branch code}-{FY yyyy}-{seq:5}", e.g. EST-CBE-2627-00007.'
      required: [id, estimate_no, branch_id, estimate_date, valid_until, status, customer_id, salesperson_id, request, computation, invoice_id, notes, created_by, created_at, version, print_count, last_printed_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        estimate_no: { type: string }
        branch_id: { $ref: '#/components/schemas/Uuid' }
        estimate_date: { type: string, format: date }
        valid_until: { type: string, format: date }
        status: { $ref: '#/components/schemas/EstimateStatus' }
        customer_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        salesperson_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        request: { $ref: '#/components/schemas/EstimateRequest', description: As saved (prefill for convert) }
        computation: { $ref: '#/components/schemas/BillComputation', description: 'draft: re-priced at today''s rates on every read; billed / cancelled / expired: as last saved' }
        invoice_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        notes: { type: [string, 'null'] }
        created_by: { $ref: '#/components/schemas/Uuid' }
        created_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        print_count: { type: integer, minimum: 0, description: '0.9.2: prints logged so far' }
        last_printed_at: { type: [string, 'null'], format: date-time, description: '0.9.2: last print, null = never printed' }
    EstimatePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, estimate_no, branch_id, estimate_date, valid_until, status, customer_id, customer_name, net_payable, invoice_id, version]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              estimate_no: { type: string }
              branch_id: { $ref: '#/components/schemas/Uuid' }
              estimate_date: { type: string, format: date }
              valid_until: { type: string, format: date }
              status: { $ref: '#/components/schemas/EstimateStatus' }
              customer_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
              customer_name: { type: [string, 'null'] }
              net_payable: { $ref: '#/components/schemas/Money' }
              invoice_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
              version: { type: integer, minimum: 1 }
        next_cursor: { type: [string, 'null'] }
    SalesPrintRequest:
      type: object
      additionalProperties: false
      description: 'copy auto uses server numbering/status rules; duplicate explicitly asks for a duplicate. Reason presence/min-length is a business rule when a duplicate is possible, NOT an unconditional schema requirement (first-live prohibition takes precedence). Explicit duplicate NEVER requests ORIGINAL. 997 forbids first duplicates for live invoices, credit notes, estimates and receipts:422 first_print_duplicate_not_supported, with no print logged. A cancelled invoice may start with a duplicate. Successful duplicates are never followed by an original.'
      properties:
        copy: { type: string, enum: [auto, duplicate], default: auto, description: 'Never accepts original. First duplicate for a non-cancelled document is forbidden by the993/997 data-model constraint (not a JSON-shape rejection); rejected attempts leave the next auto print ORIGINAL1. On a live invoice or receipt first explicit duplicate,422 first_print_duplicate_not_supported wins over missing/short reason, template configuration and words business checks; non-en/ta overrides are now schema-shape validation_failed before this rule. Auth, access/reprint permission, tenant/document404 and schema-shape validation remain ahead of it.' }
        paper: { $ref: '#/components/schemas/SalesPaperFormat', description: Default SalesSettings.default_paper }
        language: { $ref: '#/components/schemas/SalesPrintLanguage', description: 'Only en/ta overrides in0.9.5; other client values →422 validation_failed BEFORE business checks. Defaults to selected template language, independent of UI language; pinned for reprints. Legacy unsupported stored defaults fail422 print_language_not_supported, never silently English.' }
        numerals: { $ref: '#/components/schemas/NumeralSystem', description: 'LANG-3; initially defaults to the selected template numerals; reprints default to first-print numerals. Explicit override allowed. Stored data and GSTIN / HSN / HUID / document identifiers stay Latin.' }
        reprint_reason: { type: [string, 'null'], maxLength: 200, description: 'Required (trimmed 3-200) when a DUPLICATE can actually be issued; live invoice first explicit duplicate instead returns first_print_duplicate_not_supported before the missing/short-reason check. Includes print 1 of a cancelled invoice and estimate reprints (422 reprint_reason_required); ignored for an ORIGINAL' }
    SalesPrintLanguage: { type: string, enum: [en, ta], description: '0.9.5 approved print-only scope en/ta. Other setting/override values →422 validation_failed. UI/user/default languages remain unrestricted within platform catalogue. Legacy invalid print metadata hits print_language_not_supported backstop.' }
    SalesPrintLocale: { type: string, pattern: '^[a-z]{2}-IN$', examples: ['en-IN', 'ta-IN'], description: 'Indian amount-words locale derived from the selected print language' }
    SalesPrintDocument:
      type: object
      description: 'Render data for the first print''s pinned template ID/version of doc_type (active selection only at first print) (WL-4). The frontend resolves and renders that exact template ID/version, NEVER the currently active version. No server renderer or rendered-output hash this release. Use frozen snapshot for content, and this envelope for copy/CANCELLED stamp, print time, language/locale/numerals and paper. document is a live compatibility view and MUST NOT be used for reprint content.'
      required: [doc_type, doc_id, doc_no, copy, doc_cancelled, stamp, print_no, printed_at, printed_by, paper, language, locale, numerals, template_id, template_version, amount_in_words, notes, snapshot, document, template_repinned, repinned_from, template_fallback_from]
      properties:
        doc_type: { enum: [invoice, credit_note, estimate, payment_receipt], description: 'Sales document kind; payment_receipt resolves branding PrintDocType receipt' }
        doc_id: { $ref: '#/components/schemas/Uuid' }
        doc_no: { type: string }
        copy: { $ref: '#/components/schemas/PrintCopy' }
        doc_cancelled: { type: boolean, description: 'Immutable print-time invoice status snapshot; true requires DUPLICATE stamped CANCELLED even at print 1. False for live invoices, estimates, credit notes and payment receipts.' }
        stamp: { type: [string, 'null'], enum: [DUPLICATE, CANCELLED, ESTIMATE, REVERSED, REVERSAL, !!null null], description: 'DUPLICATE on reprints; CANCELLED (with the credit note number in notes) on a cancelled bill; ESTIMATE on estimates; reversed collections use REVERSED and negative reversal receipts REVERSAL (including ORIGINAL1 per993/997)' }
        print_no: { type: integer, minimum: 1 }
        printed_at: { type: string, format: date-time }
        printed_by: { $ref: '#/components/schemas/Uuid' }
        paper: { $ref: '#/components/schemas/SalesPaperFormat' }
        language: { $ref: '#/components/schemas/SalesPrintLanguage' }
        locale: { $ref: '#/components/schemas/SalesPrintLocale' }
        numerals: { $ref: '#/components/schemas/NumeralSystem' }
        template_id: { $ref: '#/components/schemas/Uuid', description: 'Required configured template; pinned from first print, even when inactive now. Missing/legacy unpinned template is422, never a new active substitution.' }
        template_version: { type: integer, minimum: 1 }
        template_repinned: { type: boolean, description: '0.9.6 (B-2): true only on a recovery reprint (explicit copy=duplicate + reprint_reason) of a document whose first print was pinned to a non-renderable template; template_id/version are then the platform default pin. Never true for a renderable pin.' }
        repinned_from:
          description: '0.9.6: the original non-renderable pin when template_repinned, else null.'
          oneOf:
            - { type: 'null' }
            - type: object
              required: [template_id, template_version]
              properties: { template_id: { $ref: '#/components/schemas/Uuid' }, template_version: { type: integer, minimum: 1 } }
        template_fallback_from:
          description: '0.9.6 1(a): on the FIRST print only — the active tenant/partner template that was skipped because it is not a release pin; template_id/version are then the doc type''s 998 platform default v1 (also audited as sales.<doc>.print_template_fallback). null on every other print (reprints keep the ORIGINAL pin and are not a fallback).'
          oneOf:
            - { type: 'null' }
            - type: object
              required: [template_id, template_version]
              properties: { template_id: { $ref: '#/components/schemas/Uuid' }, template_version: { type: integer, minimum: 1 } }
        amount_in_words: { type: string, description: 'Of totals.net_payable (credit note total; receipt absolute signed total, preserving REVERSAL stamp), in the print language, Indian lakh / crore style (LANG-3)' }
        notes: { type: array, items: { type: string }, description: 'Printed notes: zero-GST note + reason, cancellation note, "Not a tax invoice" on estimates' }
        snapshot:
          description: 'Frozen public render projection, recorded in append-only tenant print audit in the same transaction. Invoice financial values are AT ISSUE (status issued, no later receipts/returns/print counters); CN balance is its initial store_credit_amount; estimate is its first printed saved revision, not a live reprice. Reprints return deep-identical snapshot even after edits/redemption/master changes. PAN last4 only, no Aadhaar. Legacy estimates without a print snapshot fail422 rather than guess.'
          oneOf:
            - { $ref: '#/components/schemas/Invoice' }
            - { $ref: '#/components/schemas/CreditNote' }
            - { $ref: '#/components/schemas/Estimate' }
            - { $ref: '#/components/schemas/PaymentReceiptPrintSnapshot' }
        document:
          description: 'Live compatibility view including current due/status/balance/print metadata. Render snapshot, not this field.'
          oneOf:
            - { $ref: '#/components/schemas/Invoice' }
            - { $ref: '#/components/schemas/CreditNote' }
            - { $ref: '#/components/schemas/Estimate' }
            - { $ref: '#/components/schemas/PaymentReceipt' }
    SalesPrintLogEntry:
      type: object
      required: [print_no, copy, doc_cancelled, printed_at, printed_by, paper, language, locale, numerals, template_id, template_version, reprint_reason]
      properties:
        print_no: { type: integer, minimum: 1 }
        copy: { $ref: '#/components/schemas/PrintCopy' }
        doc_cancelled: { type: boolean, description: 'Immutable print-time invoice status snapshot; true requires DUPLICATE stamped CANCELLED even at print 1. False for live invoices, estimates, credit notes and payment receipts.' }
        printed_at: { type: string, format: date-time }
        printed_by: { $ref: '#/components/schemas/Uuid' }
        paper: { $ref: '#/components/schemas/SalesPaperFormat' }
        language: { $ref: '#/components/schemas/LanguageCode' }
        locale: { $ref: '#/components/schemas/SalesPrintLocale' }
        numerals: { $ref: '#/components/schemas/NumeralSystem' }
        template_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Null only in legacy unpinned print history; such documents cannot be silently repinned.' }
        template_version: { type: [integer, 'null'] }
        reprint_reason: { type: [string, 'null'] }
    RepairLineInput:
