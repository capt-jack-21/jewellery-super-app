      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KycDocumentInput' } } } }
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/KycDocument' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable', description: 'Codes: validation_failed, unknown_reference, inactive_master, idempotency_key_invalid, idempotency_key_reused, aadhaar_not_allowed (doc_type aadhaar)' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /v1/exports:
    get:
      tags: [import]
      operationId: listExports
      summary: M17 export jobs, newest first (platform.export.run)
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ExportJobPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [import]
      operationId: createExport
      summary: 'M17 export one master list as CSV or XLSX (platform.export.run + masters.<area>.view)'
      description: |
        Writes the file (platform.file, area exports) in the same columns as GET /v1/import-templates/{kind}, so an export can be edited and
        re-imported through POST /v1/imports. Runs synchronously up to 20 000 rows (status completed, file_id set); larger lists → 422 too_many_rows.
        Download with GET /v1/files/{file_id}/url. PAN / bank numbers are never exported in full (last 4 only).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExportRequest' } } } }
      responses:
        '201': { description: Exported, content: { application/json: { schema: { $ref: '#/components/schemas/ExportJob' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/exports/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [import]
      operationId: getExport
      summary: One export job
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ExportJob' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/rates/current:
    get:
      tags: [rates]
      operationId: getCurrentRates
      summary: Rates in force now, one per (purity, kind) (branch row beats tenant row; latest effective_from ≤ now)
      description: Only active purities under active metals are returned; rates of deactivated purities (or purities of a deactivated metal) are omitted here but stay in GET /v1/rates history.
      parameters: [{ name: branch_id, in: query, required: false, description: Omitted → tenant-wide rows only, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MetalRate' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/rates/todays-status:
    get:
      tags: [rates]
      operationId: getTodaysRateStatus
      summary: Today's (IST) rate status from rates.v_todays_rate_status (any signed-in user)
      description: |
        Rule (migration 985, R9): a branch is SET when every active metal that has ≥1 active purity has a SALE rate with rate_date = today (IST)
        on at least one of its active purities, either shop-wide (branch_id null) or the branch's own override. A shop with no active metal is NOT set.
        old_metal is a WARNING only (old_metal_rate_set / missing_old_metal_codes) and never gates billing.
        With branch_id → that branch's row (404 when the branch is unknown or inactive). Without → the shop summary:
        todays_rate_set = every active branch is set (same value as v_billing_unlocked.todays_rate_set); missing_* codes are the union over branches; branches lists each row.
      parameters: [{ name: branch_id, in: query, required: false, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TodaysRateStatus' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/rates/rate-card:
    get:
      tags: [rates]
      operationId: getRateCard
      summary: Rate-card print data (doc_type rate_card) — rates in force now for active metals/purities, grouped by metal (any signed-in user)
      parameters: [{ name: branch_id, in: query, required: false, description: Omitted → shop-wide rates only; given → branch override beats shop-wide, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RateCard' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/rates/batch:
    post:
      tags: [rates]
      operationId: publishRateBatch
      summary: Publish today's rates for one or more metals from a base rate each; the server derives every other active purity (rates.publish; rates.edit when correcting a rate already published today)
      description: |
        One transaction, all-or-nothing, Idempotency-Key required (same key + same body → stored response replayed; different body → 422 idempotency_key_reused).
        For each base {purity_id, rate_per_g}: the base row is written as given (derived_from_id null). Every OTHER active purity of the same metal gets
        derived_rate_per_g = ROUND_HALF_UP(base_rate × purity.fineness / base.fineness, 2) computed in Postgres numeric (round(numeric, 2), half away from zero),
        derived_from_id = the base row id, and rate_per_g = the override when one is given for that purity, else derived_rate_per_g.
        All rows share one effective_from (transaction time) and rate_date = today (IST, server-assigned; no back-dating).
        422: inactive or unknown base purity (inactive_master / not_found), two bases for one metal (duplicate_metal), override purity not a non-base active purity of a base metal (invalid_override),
        derived rate rounding to 0.00 (invalid_rate). Response lists every row written, base first per metal.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MetalRateBatchInput' } } } }
      responses:
        '400': { $ref: '#/components/responses/IdempotencyBadRequest' }
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/MetalRateBatch' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/rates:
    get:
      tags: [rates]
      operationId: listRateHistory
      summary: Rate history (read-only; same access as /v1/rates/current — any signed-in user), newest first. Includes rates of deactivated purities/metals.
      description: Sorted by effective_from DESC, id DESC. Keyset pagination using the standard Limit/Cursor params; pass next_cursor back as cursor. from/to filter rate_date (IST calendar dates, inclusive). Each row carries effective_to = effective_from of the next row for the same (purity, kind, branch scope) — an EXCLUSIVE end; null = still in force for that scope.
      parameters:
        - { name: purity_id, in: query, schema: { type: string, format: uuid } }
        - { name: metal_id, in: query, description: 'Only rates of purities under this metal (0.7.4)', schema: { type: string, format: uuid } }
        - { name: kind, in: query, schema: { enum: [sale, old_metal, purchase] } }
        - { name: branch_id, in: query, description: 'Only rows for this branch (tenant-wide rows have branch_id null and are excluded when set)', schema: { type: string, format: uuid } }
        - { name: from, in: query, description: 'Earliest rate_date (IST, inclusive)', schema: { type: string, format: date } }
        - { name: to, in: query, description: 'Latest rate_date (IST, inclusive)', schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MetalRatePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [rates]
      operationId: publishRate
      summary: Publish today's rate for a purity (rates.publish; insert-only, a correction is a new row with a later effective_from)
      description: rate_date = today in Asia/Kolkata (server-assigned). Marks onboarding step todays_rates completed. Inactive purity → 422 inactive_master. rates.metal_rate has no UPDATE grant, so there is no PUT/PATCH and no If-Match — a change is a new row (R4). Publishing again for a (purity, kind, scope) that already has a rate dated today is a correction and needs rates.edit (R6; owner + manager per 985) → else 403.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MetalRateInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/MetalRate' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/inventory/settings:
    get:
      tags: [inventory]
      operationId: getInventorySettings
      summary: Inventory settings for this shop (inventory.shop_setting; column defaults until first saved). ETag = version (inventory.stock.view)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventorySettings'}
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
      x-backing: implemented on 987-989 (test DB only; not deployed)
    patch:
      tags: [inventory]
      operationId: updateInventorySettings
      summary: 'Change Inventory settings: tag format, adjustment approver, piece photos, ageing. Audited (zz_audit on inventory.shop_setting) (inventory.settings.edit — owner only)'
      description: 'If-Match is required once the row exists (IfMatchOptional: the first save on a shop still running on defaults needs none; the row is inserted). A tag_format change never renumbers or recomputes existing tags (tag_no is stored at creation). New tags use the new format; the counter is keyed by the rendered non-number part (inventory.tag_counter.scope_key), so a new prefix/segment set starts at tag_start_no and a collision with an existing tag_no skips to the next number. 422 invalid_tag_format: tag_start_no must fit tag_digits; the longest rendering must fit 30 chars. Turning photos_enabled off keeps existing photos readable but blocks new ones; ageing_enabled off makes the ageing report 409 feature_disabled.'
      parameters:
      - {$ref: '#/components/parameters/IfMatchOptional'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InventorySettingsPatch'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventorySettings'}
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
      x-backing: implemented on 987-989 (test DB only; not deployed)
  /v1/inventory/settings/tag-format/preview:
    post:
      tags: [inventory]
      operationId: previewTagFormat
      summary: Render sample tag numbers for a tag format without allocating anything (inventory.stock.view)
      description: 'Uses the given format (or the saved one) and context (branch_id / item_id; defaults: the X-Branch-Id branch and the first active item). Samples continue from the current counter for that scope_key (or tag_start_no). Always 200 with valid:false and errors[] for a bad format; the same rules make PATCH /settings answer 422 invalid_tag_format.'
      parameters:
      - name: X-Branch-Id
        in: header
        required: false
        description: Active branch sent by the web client; used when branch_id is not given
        schema: {$ref: '#/components/schemas/Uuid'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TagFormatPreviewInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TagFormatPreview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
      x-backing: implemented on 987-989 (test DB only; not deployed)
  /v1/inventory/statuses:
    get:
      tags: [inventory]
      operationId: listStockStatuses
      summary: Tag statuses and allowed transitions (static) (inventory.stock.view)
      description: Only the Inventory module changes status, branch, location, weights or the stock ledger. Other modules call the Inventory service in their own transaction (Sales markSold / returnToStock; approval memos issueOnApproval / returnFromApproval; Purchases receive / returnToVendor; Refinery sendToMelting / melt). Any other transition → 409 invalid_status_transition.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/StockStatusInfo'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/inventory/lots:
    get:
      tags: [inventory]
      operationId: listLots
      summary: Lots (stock receipts awaiting / done tagging) with tagging progress (inventory.stock.view)
      parameters:
      - {$ref: '#/components/parameters/Q'}
      - {$ref: '#/components/parameters/MasterLimit'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Ids'}
      - name: branch_id
        in: query
        schema: {$ref: '#/components/schemas/Uuid'}
        description: Optional; falls back to the X-Branch-Id header, then to every branch the caller can see. Branch-scoped users only see their branches (403 branch_scope).
      - name: X-Branch-Id
        in: header
        required: false
        description: Active branch sent by the web client; used when branch_id is not given
        schema: {$ref: '#/components/schemas/Uuid'}
      - name: status
        in: query
        schema:
          enum: [open, tagged, closed]
      - name: vendor_id
        in: query
        schema: {$ref: '#/components/schemas/Uuid'}
      - name: entry_type
        in: query
        schema: {$ref: '#/components/schemas/LotEntryType'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LotPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
      x-backing: implemented on 987-989 (0.8.3; test DB only; not deployed)
    post:
      tags: [inventory]
      operationId: createLot
      summary: Create a lot with lines (manual receipt; Purchases / Orders / opening import create lots through the Inventory service) (inventory.tag.create)
      description: 'lot_no is assigned by the server as LOT-{BRANCH}-{FY}-{SEQ:5} (platform.doc_counter, unique per branch) unless given (≤ 30 chars); 409 duplicate_lot_no; a generated number over 30 chars → 422 invalid_lot_no. entry_type opening is used by the opening import only. Branch-scoped callers create only in their branches (403 branch_scope). purity_id defaults to the item''s purity.'
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LotInput'}
      responses:
        '400': { $ref: '#/components/responses/IdempotencyBadRequest' }
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Lot'}
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable', description: 'Codes: validation_failed, unknown_reference, inactive_master, idempotency_key_invalid, idempotency_key_reused, invalid_weights (gross must be > 0 and net ≤ gross)'}
      x-backing: implemented on 987-989 (0.8.3; test DB only; not deployed)
  /v1/inventory/lots/{id}:
    parameters:
    - {$ref: '#/components/parameters/Id'}
    get:
      tags: [inventory]
      operationId: getLot
      summary: One lot with lines and tagged vs remaining pieces / weight (inventory.stock.view)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Lot'}
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-backing: implemented on 987-989 (0.8.3; test DB only; not deployed)
    patch:
      tags: [inventory]
      operationId: updateLot
      summary: Edit an OPEN lot (header and lines). A line can never drop below what is already tagged (inventory.tag.create)
      description: 'Only status open (409 lot_not_open). lines is the whole list: a line with id is changed in place, one without is added. A line can''t go below its tagged pieces (422 below_tagged) or change item once tagged (422 validation_failed, errors[].code line_tagged); leaving a line out deletes it (0.8.4; same transaction as the rest of the PATCH), unless pieces were tagged from it → 409 line_tagged (nothing is changed). lines must keep at least one entry. When the edit leaves every remaining line fully tagged the lot becomes tagged. Every successful PATCH bumps version.'
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LotPatch'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Lot'}
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
      x-backing: implemented on 987-989 (0.8.4 line removal; test DB only; not deployed)
  /v1/inventory/lots/{id}/close:
    parameters:
    - {$ref: '#/components/parameters/Id'}
    post:
      tags: [inventory]
      operationId: closeLot
      summary: 'Close a lot. The untagged remainder is either none or posted to loose stock (remainder: to_loose) (inventory.tag.create)'
      description: 'remainder none with an untagged remainder → 409 lot_has_remainder. to_loose writes ledger non_tag_in rows (item + purity, at counter/tray if given; the untagged pieces, gross and pro-rata net); a line without a purity → 422 validation_failed (errors[].code purity_required). If-Match is required (0.8.4): missing → 428, stale → 412 version_mismatch; closing an already closed lot with its current version returns it unchanged. Tagging from a closed lot → 409 lot_not_open; more pieces than the line has left → 422 lot_line_exhausted; the lot becomes tagged when every line with pieces is fully tagged.'
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                remainder:
                  enum: [none, to_loose]
                  default: none
                counter_id: {$ref: '#/components/schemas/Uuid'}
                tray_id: {$ref: '#/components/schemas/Uuid'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Lot'}
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
      x-backing: implemented on 987-989 (0.8.4 If-Match; test DB only; not deployed)
  /v1/inventory/tags:
    get:
      tags: [inventory]
      operationId: listTags
      summary: 'Stock list: tagged pieces (inventory.stock.view)'
      description: q matches tag_no, HUID or design code (prefix, case-insensitive). Default status filter (no status param) = in stock = everything except sold, melted, returned_to_vendor and written_off (0.8.5 - written_off is now hidden by default). Pass status explicitly (e.g. status=written_off, or a list including it) to see terminal pieces. cost_value is null unless the caller has inventory.tag.view_cost. Keyset paging by tagged_at DESC, id.
      parameters:
      - {$ref: '#/components/parameters/Q'}
      - {$ref: '#/components/parameters/MasterLimit'}
      - {$ref: '#/components/parameters/Cursor'}
