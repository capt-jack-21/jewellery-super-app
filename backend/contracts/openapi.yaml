      required: [id, doc_no, doc_seq, fy, doc_date, issued_at, branch_id, invoice_id, invoice_no, seller, place_of_supply, gst_type, supply_type, gst_applicable, original_invoice, tax_summary, kind, reason, lines, taxable_value, cgst, sgst, igst, cess, round_off, total, refund_mode, refund_amount, due_reduced, store_credit_amount, balance_available, customer, created_by, print_count, last_printed_at, reversal_receipt_id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        doc_no: { type: string, maxLength: 16, readOnly: true }
