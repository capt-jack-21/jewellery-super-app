        company: { type: object, additionalProperties: false, required: [legal_name, state_code], properties: { legal_name: { type: string, minLength: 1, maxLength: 200 }, gstin: { $ref: '#/components/schemas/Gstin' }, pan: { $ref: '#/components/schemas/Pan' }, state_code: { $ref: '#/components/schemas/StateCode' } } }
        branch: { type: object, additionalProperties: false, required: [code, name], description: 'State = company state (provision_tenant). bill_series_prefix defaults to the branch code.', properties: { code: { type: string, pattern: '^[A-Z0-9]{1,10}$' }, name: { type: string, minLength: 1, maxLength: 120 }, bill_series_prefix: { type: string, description: 'Optional. Upper-cased by the server, then must match ^[A-Z0-9][A-Z0-9/-]{0,11}$ (1–12 chars A-Z 0-9 / -, not starting with / or -); otherwise 422 invalid_bill_series_prefix. Omitted or blank → the branch code. The 201 response echoes the stored value.', examples: [y/26-a] } } }
        owner: { type: object, additionalProperties: false, required: [name, password], properties: { name: { type: string, minLength: 1, maxLength: 120 }, username: { $ref: '#/components/schemas/Username' }, phone: { $ref: '#/components/schemas/Phone' }, password: { $ref: '#/components/schemas/Password' } } }
