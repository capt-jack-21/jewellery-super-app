        tag_id:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
        item_id:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
        purity_id:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
        counter_id:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
        tray_id:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
        delta_pieces: {type: integer, default: 0}
        delta_gross_wt: {$ref: '#/components/schemas/SignedWeight'}
        delta_net_wt: {$ref: '#/components/schemas/SignedWeight'}
        reason_code: {$ref: '#/components/schemas/StockAdjustmentReasonCode'}
