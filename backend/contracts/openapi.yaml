      description: inventory.stock_ledger.movement (080 + 988 move_out/move_in).
    LocationRef:
      type: object
      description: branch (platform.branch) → counter (masters.counter) → tray (masters.box, /v1/masters/trays). A tray needs its counter, the counter must be in the branch (422 location_mismatch). Null counter = branch level.
      required: [branch_id, counter_id, tray_id]
      properties:
        branch_id: {$ref: '#/components/schemas/Uuid'}
        counter_id:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
        tray_id:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
    TagFormat:
      type: object
      description: Structured tag-number format (inventory.shop_setting.tag_*). tag_no = prefix [sep segment]... sep zero-padded number, e.g. the defaults give "T000123"; {prefix:"", separator:"-", branch_segment:true, item_segment:true} gives "CBE-RNG-000123". The counter scope (tag_counter.scope_key) is the rendered non-number part, so with branch/item segments numbering runs per branch / per item; without them per shop. Rendered tag_no ≤ 30 chars. The number is always part of a tag_no, so with prefix "" and no branch or item segments the tag_no is only the zero-padded number (e.g. "000123").
      required: [prefix, separator, branch_segment, item_segment, segment_order, start_no, digits]
      additionalProperties: false
      properties:
        prefix: {type: string, pattern: '^[A-Z0-9]{0,8}$', default: T}
        separator:
          enum: ['', '-', /]
          default: ''
        branch_segment: {type: boolean, default: false, description: Include platform.branch.code}
        item_segment: {type: boolean, default: false, description: 'Include masters.item.code (upper-cased, A-Z0-9 only)'}
        segment_order:
          enum: [branch_item, item_branch]
          default: branch_item
        start_no: {type: integer, minimum: 1, maximum: 999999999999, default: 1, description: First number of a new counter scope; must be < 10^digits}
        digits: {type: integer, minimum: 1, maximum: 12, default: 6, description: Zero-padded width of the number}
    TagFormatPatch:
      type: object
      additionalProperties: false
      properties:
        prefix: {type: string, pattern: '^[A-Z0-9]{0,8}$', default: T}
        separator:
          enum: ['', '-', /]
          default: ''
        branch_segment: {type: boolean, default: false, description: Include platform.branch.code}
        item_segment: {type: boolean, default: false, description: 'Include masters.item.code (upper-cased, A-Z0-9 only)'}
        segment_order:
          enum: [branch_item, item_branch]
          default: branch_item
        start_no: {type: integer, minimum: 1, maximum: 999999999999, default: 1, description: First number of a new counter scope; must be < 10^digits}
        digits: {type: integer, minimum: 1, maximum: 12, default: 6, description: Zero-padded width of the number}
      minProperties: 1
    InventorySettings:
      type: object
      required: [tag_format, adjustment_approver, photos_enabled, ageing_enabled, ageing_bucket_days, source, version]
      properties:
        tag_format: {$ref: '#/components/schemas/TagFormat'}
        adjustment_approver:
          enum: [owner_or_manager, owner_only]
          default: owner_or_manager
          description: 'Who may approve stock adjustments. Approval itself is mandatory: there is no setting to apply adjustments (or dispatch transfers) without an approver (lead decision 13).'
        photos_enabled: {type: boolean, default: false, description: 'Optional feature: photos per piece'}
        ageing_enabled: {type: boolean, default: false, description: 'Optional feature: ageing report'}
        ageing_bucket_days:
          type: array
          minItems: 1
          maxItems: 8
          items: {type: integer, minimum: 1, maximum: 3650}
          default: [30, 90, 180, 365]
          description: Bucket lower bounds in days; the server sorts and de-duplicates. [30,90,180,365] = 0-29, 30-89, 90-179, 180-364, 365+
        tag_format_example: {type: string, readOnly: true, description: Rendering for the caller's branch and a sample item}
        transfer_no_format:
          type: string
          minLength: 1
          maxLength: 64
          default: TRF-{BRANCH}-{FY}-{SEQ:5}
          description: 'Transfer number format (inventory.shop_setting.transfer_no_format). Tokens: {BRANCH} (platform.branch.code), {FY} (Indian FY, e.g. 2627), and exactly one {SEQ} or {SEQ:n} (n = 1-99 zero-pad width), which must be the last token. Other characters: A-Z a-z 0-9 - / _. A format with no prefix and no other tokens ("{SEQ:5}") gives the zero-padded sequence only. Rendered length (with a 10-char branch code) ≤ 64. Anything else → 422 validation_failed (errors[].message invalid_format). Changing it affects only numbers issued afterwards; the counter (platform.doc_counter) stays per shop / branch / FY.'
        adjustment_no_format:
          type: string
          minLength: 1
          maxLength: 64
          default: ADJ-{BRANCH}-{FY}-{SEQ:5}
          description: 'Adjustment number format (inventory.shop_setting.adjustment_no_format). Tokens: {BRANCH} (platform.branch.code), {FY} (Indian FY, e.g. 2627), and exactly one {SEQ} or {SEQ:n} (n = 1-99 zero-pad width), which must be the last token. Other characters: A-Z a-z 0-9 - / _. A format with no prefix and no other tokens ("{SEQ:5}") gives the zero-padded sequence only. Rendered length (with a 10-char branch code) ≤ 64. Anything else → 422 validation_failed (errors[].message invalid_format). Changing it affects only numbers issued afterwards; the counter (platform.doc_counter) stays per shop / branch / FY.'
        source:
          enum: [default, shop]
          description: default = never saved (no row; If-Match not needed)
        version: {type: integer, minimum: 0, readOnly: true, description: 0 when source is default}
        updated_at:
          type: [string, 'null']
          format: date-time
        updated_by:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
    InventorySettingsPatch:
      type: object
      additionalProperties: false
      properties:
        tag_format: {$ref: '#/components/schemas/TagFormatPatch'}
        adjustment_approver:
          enum: [owner_or_manager, owner_only]
          default: owner_or_manager
        photos_enabled: {type: boolean, default: false, description: 'Optional feature: photos per piece'}
        ageing_enabled: {type: boolean, default: false, description: 'Optional feature: ageing report'}
        ageing_bucket_days:
          type: array
          minItems: 1
          maxItems: 8
          items: {type: integer, minimum: 1, maximum: 3650}
          default: [30, 90, 180, 365]
          description: Bucket lower bounds in days; the server sorts and de-duplicates. [30,90,180,365] = 0-29, 30-89, 90-179, 180-364, 365+
        transfer_no_format: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9{}:/_-]+$', description: 'See InventorySettings.transfer_no_format; must contain exactly one {SEQ} / {SEQ:n}, last (422 otherwise)'}
        adjustment_no_format: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9{}:/_-]+$', description: 'See InventorySettings.adjustment_no_format; same rules'}
      minProperties: 1
    TagFormatPreviewInput:
      type: object
      description: tag_format fields not given are taken from the saved settings.
      additionalProperties: false
      properties:
        tag_format: {$ref: '#/components/schemas/TagFormatPatch'}
        branch_id: {$ref: '#/components/schemas/Uuid'}
