        - { name: party_id, in: query, description: 'documents of one customer, vendor or staff member', schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items, next_cursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/KycDocument' } }, next_cursor: { type: [string, 'null'] } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [masters]
