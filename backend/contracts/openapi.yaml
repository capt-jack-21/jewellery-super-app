        tax_parts: { type: array, minItems: 1, items: { $ref: '#/components/schemas/TaxPart' }, description: 'Immutable original component HSN/SAC and rate/CGST/SGST/IGST/cess split; whole-line returns only' }
        taxable_value: { $ref: '#/components/schemas/Money' }
