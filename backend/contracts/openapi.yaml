  /v1/masters/{party}/{id}/kyc/reveal:
    parameters:
      - { name: party, in: path, required: true, schema: { type: string, enum: [customers, vendors, staff] } }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [masters]
      operationId: revealKyc
      summary: 'G2: full PAN and KYC document numbers (masters.kyc.reveal: owner, manager). Response is Cache-Control: no-store.'
      description: 'Mandatory reason (10-500 chars). One audit event kyc.reveal per revealed field with {field, reason} (never the value). DB-backed limit: 10 reveals per user per hour, then 429 rate_limited with Retry-After.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 10, maxLength: 500 } } }
      responses:
        '200':
          description: Revealed
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json:
              schema:
                type: object
                required: [party_type, id, pan, pan_not_migrated, documents]
                properties:
                  party_type: { type: string, enum: [customer, vendor, staff] }
                  id: { $ref: '#/components/schemas/Uuid' }
                  pan: { type: [string, 'null'], description: 'Full PAN; when pan_not_migrated is true, the masked legacy value (XXXXXX + last 4, not audited as a reveal).' }
                  pan_not_migrated: { type: boolean, description: 'Vendor only: true while the row has a legacy pan but no sealed pan_enc (backfill pending).' }
                  documents:
                    type: array
                    items: { type: object, required: [id, doc_type, number], properties: { id: { $ref: '#/components/schemas/Uuid' }, doc_type: { $ref: '#/components/schemas/KycDocType' }, number: { type: [string, 'null'] } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { description: 'rate_limited', headers: { Retry-After: { schema: { type: integer } } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
