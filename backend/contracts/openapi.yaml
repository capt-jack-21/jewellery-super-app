        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/audit-events/verify:
    get:
      tags: [audit]
      operationId: verifyAuditChain
      summary: Verify the shop's hash chain (platform.audit_verify)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [intact], properties: { intact: { type: boolean }, first_broken_seq: { type: [integer, 'null'] }, last_seq: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # ======================= IMPORT (P21) =======================
  /v1/import-templates/{kind}:
    parameters: [{ name: kind, in: path, required: true, schema: { $ref: '#/components/schemas/ImportKind' } }]
    get:
      tags: [import]
      operationId: getImportTemplate
      summary: Downloadable CSV header template for an import kind
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/imports:
    get:
      tags: [import]
      operationId: listImports
      summary: Import jobs
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ImportJob' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [import]
      operationId: createImport
      summary: Upload a CSV or XLSX file and run a dry run (validates every row; writes nothing) (platform.import.run)
      description: |
        Always a dry run. The response lists row errors. To import, call `POST /v1/imports/{id}/commit` on a
        validated dry run (the same file is re-validated and written in one transaction). Kinds: customers
        (PAN encrypted, only last 4 shown), stock (opening stock: tags and loose), opening_balances (account heads). Row errors are stored
        in platform.import_row_error. Optional `profile_id` applies a saved column mapping
        to the uploaded file: each mapping entry {template column → source header} is matched (trimmed, case-insensitive)
        against the file's raw header row, and the mapped values are validated as that template column. Unmapped
        template columns keep their own header name. The dry run freezes the applied mapping in `mapping_snapshot` (immutable; `{}` when no profile)
        and stores `mapping_profile_id`. Commit applies ONLY the snapshot to the stored file; later edits to the profile don't change it. Send the `kind`, `branch_id` and `profile_id` parts BEFORE the `file` part (fields after it are not read).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { $ref: '#/components/schemas/ImportKind' }
                branch_id: { $ref: '#/components/schemas/Uuid', description: Required for stock }
                profile_id: { $ref: '#/components/schemas/Uuid', description: Saved mapping profile of the same kind }
                file: { type: string, contentMediaType: application/octet-stream, description: '.csv (UTF-8) or .xlsx, max 5 MB, max 20 000 rows' }
      responses:
        '201': { description: Dry run finished, content: { application/json: { schema: { $ref: '#/components/schemas/ImportJob' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/imports/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [import]
      operationId: getImport
      summary: Import job with row errors
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ImportJob' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/imports/{id}/commit:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [import]
      operationId: commitImport
      summary: Run the real import for a validated dry run (creates a new job with dry_run_of = id). All-or-nothing.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '400': { $ref: '#/components/responses/IdempotencyBadRequest' }
        '201': { description: Imported, content: { application/json: { schema: { $ref: '#/components/schemas/ImportJob' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/imports/{id}/errors:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [import]
      operationId: listImportErrors
      summary: All row errors of a job (platform.import_row_error), paged by row
      parameters: [{ name: after_row, in: query, schema: { type: integer, minimum: 0, default: 0 } }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ImportRowError' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/files/{id}/url:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [import]
      operationId: getFileDownloadUrl
      summary: 'Short-lived signed download link for a stored file. Who may ask depends on the file: imports / exports → platform.import.run; attachments → the permission of what uses them (piece photos → inventory.stock.view)'
      description: |
        Permission by file (403 permission_denied otherwise): import / export files need platform.import.run. Attachments (area
        attachments): the uploader always; design photos → masters.designs.view; staff photos → masters.staff.view; KYC scans →
        masters.<party>.manage; piece photos (purpose tag_photo, attached with addTagPhoto) → inventory.stock.view and the piece's
        branch visible to the caller (the same rule as reading the piece, 0.8.4).
        0.5.1. `{id}` is a platform.file id (e.g. ImportJob.file_id). Legacy fallback: an import job id, which resolves to the
        job's file (or, for jobs created before 0.5.1 without file_id, to its stored upload). Soft-deleted files and another shop's
        ids are 404 (RLS). The returned `url` is relative to the site origin (NOT under `/api`), valid for 5 minutes, single purpose
        (download), and needs no session; fetch it directly or open it in a new tab. Request a fresh link for each download.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url: { type: string, pattern: '^/files/[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$', examples: ['/files/eyJwIjoiQ.x9fK2'] }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /files/{token}:
    servers: [{ url: / }]
    parameters: [{ name: token, in: path, required: true, schema: { type: string, maxLength: 2048 } }]
    get:
      tags: [import]
      operationId: downloadFile
      summary: Stream a file by signed token (no session)
      description: |
        0.5.0. Served at the site root (`/files/<token>`, not `/api`). The HMAC-signed token is the only credential.
        Headers: `Content-Type` (platform.file.content_type), `Content-Disposition: attachment; filename="<ASCII fallback>"; filename*=UTF-8''<RFC 5987 original_name>`
        (legacy jobs: `import-<id>.<csv|xlsx>`),
        `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`. Malformed, tampered, unknown or soft-deleted (checked again at download, under RLS) → 404; expired → 410 `link_expired`.
      security: []
      responses:
        '200':
          description: File bytes
          headers:
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            text/csv: { schema: { type: string } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet } }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: Link expired (`link_expired`); request a new one, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /v1/import-mapping-profiles:
    get:
      tags: [import]
      operationId: listImportMappingProfiles
      summary: Saved column mappings (platform.import_mapping_profile)
      parameters: [{ name: kind, in: query, schema: { $ref: '#/components/schemas/ImportKind' } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ImportMappingProfile' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [import]
      operationId: createImportMappingProfile
      summary: Save a mapping profile (platform.import.run). Mapping targets must be template columns of the kind.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ImportMappingProfileInput' } } } }
      responses:
        '201': { description: Created, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ImportMappingProfile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/import-mapping-profiles/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [import]
      operationId: getImportMappingProfile
      summary: One mapping profile
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ImportMappingProfile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [import]
      operationId: updateImportMappingProfile
      summary: Edit a mapping profile (platform.import.run)
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ImportMappingProfilePatch' } } } }
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ImportMappingProfile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [import]
      operationId: deleteImportMappingProfile
      summary: Delete a mapping profile (platform.import.run)
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'mapping_profile_in_use — referenced by an import job (import_job.mapping_profile_id)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
