      x-backing: implemented on 01002 (O2; Sales takeAdvance; test DB only; not deployed)
    post:
      tags: [orders]
      operationId: takeOrderAdvance
      summary: Take an advance for an order, in money or in metal (orders.advance.take)
      description: 'kind amount: amount > 0, no weight or purity; the money balance = amount. kind metal: weight (grams) and purity_id; the fine-gram balance = weight x fineness / 1000 (rounded to the milligram), the money balance stays 0.00. lock_rate_per_g optionally locks ONE rate per gram on the order (no expiry or cap in v1); a different rate on an order that already has one is 409 rate_already_locked. Allowed while the order is open, in production or ready (409 order_not_open otherwise); a shop order without a customer is 409 order_needs_customer. The receipt number ADV-{BRANCH}-{FY}-{SEQ:5} is assigned by Sales. Creating an advance does not change the order version unless it locks the rate.'
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OrderAdvanceInput'}}}}
      responses:
        '400': {$ref: '#/components/responses/IdempotencyBadRequest'}
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/OrderAdvance'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable', description: 'Codes: validation_failed, idempotency_key_invalid, idempotency_key_reused'}
      x-backing: implemented on 01002 (O2; Sales takeAdvance; test DB only; not deployed)
  /v1/orders/{id}/deliver:
    parameters:
    - {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    post:
      tags: [orders]
      operationId: deliverOrder
      summary: Deliver the order and bill it through Sales (orders.order.deliver, sales.invoice.issue)
      description: 'The order must be ready (409 order_not_ready; a shop order has no customer to bill: 409 order_needs_customer). Sales issues ONE tax invoice for the received pieces in the same transaction: the pieces go reserved to sold, priced at the order''s locked rate under the shop''s rate_rule (locked, or lower_of the locked and today''s rate; 409 locked_rate_mixed_purity if the pieces have different purities), and the order''s open MONEY advances are applied as payment, oldest first, up to what is due (apply_advances false = none). Metal advances are not applied in this release. payments are the rest of the bill as in POST /v1/sales/invoices (an unpaid rest becomes a credit-sale balance when the shop allows it). Any Sales refusal (device not approved, todays_rates_missing, PAN, limits) comes back unchanged and leaves the order untouched. The invoice carries order_id internally; the order becomes delivered and its lines delivered.'
      parameters:
      - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OrderDeliverInput'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/OrderDeliverResult'}}}, headers: {ETag: {$ref: '#/components/headers/ETag'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
