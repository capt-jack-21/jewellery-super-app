<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- In production the API renders this shell per host: title, theme-color, manifest and
         /branding.css are substituted so first paint is already tenant-branded. The build fills the platform
         default (vite.config.ts DEFAULT_BRAND_APP_NAME) so raw HTML is never blank. -->
    <title>%VITE_BRAND_APP_NAME%</title>
    <meta name="theme-color" content="" id="meta-theme-color" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
